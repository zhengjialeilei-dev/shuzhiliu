<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoCanvas Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#0f172a',
              accent: '#3b82f6',
            },
            animation: {
              'fade-in': 'fadeIn 0.2s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'scale(0.95)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #f8fafc;
      }
      .grid-bg {
        background-size: 40px 40px;
        background-image:
          linear-gradient(to right, rgba(203, 213, 225, 0.4) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(203, 213, 225, 0.4) 1px, transparent 1px);
      }
    </style>
    <!-- Babel for in-browser transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Import Map for modules -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useCallback, useRef } from 'react';
        import ReactDOM from 'react-dom/client';
        import { 
          MousePointer2, 
          Circle, 
          Triangle, 
          Minus, 
          Dot, 
          Pencil, 
          Undo2, 
          Redo2, 
          Trash2, 
          Grid
        } from 'lucide-react';

        // --- Utils ---
        const GRID_SIZE = 40;

        const generateId = () => Math.random().toString(36).substr(2, 9);

        const snapToGrid = (value) => Math.round(value / GRID_SIZE) * GRID_SIZE;

        const getDistance = (p1, p2) => {
          return Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
        };

        const getSVGCoordinates = (event, svgRef) => {
          if (!svgRef.current) return { x: 0, y: 0 };
          const CTM = svgRef.current.getScreenCTM();
          if (!CTM) return { x: 0, y: 0 };
          return {
            x: (event.clientX - CTM.e) / CTM.a,
            y: (event.clientY - CTM.f) / CTM.d
          };
        };

        // --- Components ---

        // Toolbar
        const Toolbar = ({ 
          currentTool, 
          setTool, 
          canUndo, 
          canRedo, 
          onUndo, 
          onRedo,
          onClear,
          showGrid,
          toggleGrid
        }) => {
          const tools = [
            { id: 'select', icon: MousePointer2, label: 'Select' },
            { id: 'point', icon: Dot, label: 'Point' },
            { id: 'line', icon: Minus, label: 'Line' },
            { id: 'triangle', icon: Triangle, label: 'Triangle' },
            { id: 'circle', icon: Circle, label: 'Circle' },
            { id: 'pencil', icon: Pencil, label: 'Freehand' },
          ];

          return (
            <div className="fixed right-4 top-1/2 -translate-y-1/2 bg-white/90 backdrop-blur-md shadow-2xl rounded-2xl p-3 flex flex-col gap-3 border border-slate-200 z-50 animate-fade-in transition-all">
              <div className="flex flex-col gap-2 pb-3 border-b border-slate-200">
                {tools.map((toolItem) => (
                  <button
                    key={toolItem.id}
                    onClick={() => setTool(toolItem.id)}
                    title={toolItem.label}
                    className={`p-3 rounded-xl transition-all duration-200 relative group ${
                      currentTool === toolItem.id
                        ? 'bg-blue-600 text-white shadow-md scale-105'
                        : 'text-slate-500 hover:bg-slate-100 hover:text-slate-900'
                    }`}
                  >
                    <toolItem.icon size={22} strokeWidth={currentTool === toolItem.id ? 2.5 : 2} />
                    <span className="absolute right-full mr-3 top-1/2 -translate-y-1/2 px-2 py-1 bg-slate-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 pointer-events-none whitespace-nowrap transition-opacity">
                      {toolItem.label}
                    </span>
                  </button>
                ))}
              </div>

              <div className="flex flex-col gap-2 pt-1">
                 <button
                  onClick={toggleGrid}
                  title="Toggle Grid"
                  className={`p-3 rounded-xl transition-all duration-200 ${
                    showGrid ? 'bg-indigo-50 text-indigo-600' : 'text-slate-500 hover:bg-slate-100'
                  }`}
                >
                  <Grid size={20} />
                </button>

                <div className="flex gap-2 justify-center">
                  <button
                    onClick={onUndo}
                    disabled={!canUndo}
                    className="p-2 rounded-lg text-slate-500 hover:bg-slate-100 disabled:opacity-30 disabled:hover:bg-transparent transition-colors"
                  >
                    <Undo2 size={20} />
                  </button>
                  <button
                    onClick={onRedo}
                    disabled={!canRedo}
                    className="p-2 rounded-lg text-slate-500 hover:bg-slate-100 disabled:opacity-30 disabled:hover:bg-transparent transition-colors"
                  >
                    <Redo2 size={20} />
                  </button>
                </div>
                
                <button
                  onClick={onClear}
                  className="p-3 rounded-xl text-red-500 hover:bg-red-50 hover:text-red-600 transition-colors mt-2"
                  title="Clear Board"
                >
                  <Trash2 size={20} />
                </button>
              </div>
            </div>
          );
        };

        // Canvas
        const Canvas = ({ 
          tool, 
          shapes, 
          setShapes, 
          addToHistory, 
          snapEnabled 
        }) => {
          const svgRef = useRef(null);
          const [isDrawing, setIsDrawing] = useState(false);
          const [currentShape, setCurrentShape] = useState(null);
          const [dragStart, setDragStart] = useState(null);
          const [selectedShapeId, setSelectedShapeId] = useState(null);

          const getPoint = (e) => {
            const raw = getSVGCoordinates(e, svgRef);
            if (snapEnabled && tool !== 'pencil') {
              return { x: snapToGrid(raw.x), y: snapToGrid(raw.y) };
            }
            return raw;
          };

          const handleMouseDown = (e) => {
            const point = getPoint(e);

            if (tool === 'select') {
              const target = e.target;
              const id = target.getAttribute('data-id');
              
              if (id) {
                setSelectedShapeId(id);
                const shape = shapes.find(s => s.id === id);
                if (shape) {
                  setDragStart(point);
                  setIsDrawing(true);
                }
              } else {
                setSelectedShapeId(null);
              }
              return;
            }

            setIsDrawing(true);
            setDragStart(point);

            const baseShape = {
              id: generateId(),
              color: '#3b82f6',
              strokeWidth: 2,
            };

            switch (tool) {
              case 'point':
                setCurrentShape({ ...baseShape, type: 'point', x: point.x, y: point.y, strokeWidth: 6 });
                break;
              case 'line':
                setCurrentShape({ ...baseShape, type: 'line', start: point, end: point });
                break;
              case 'circle':
                setCurrentShape({ ...baseShape, type: 'circle', center: point, radius: 0 });
                break;
              case 'triangle':
                setCurrentShape({ ...baseShape, type: 'triangle', points: [point, point, point] });
                break;
              case 'pencil':
                setCurrentShape({ ...baseShape, type: 'pencil', points: [point] });
                break;
            }
          };

          const handleMouseMove = (e) => {
            if (!isDrawing) return;
            
            const point = getPoint(e);

            if (tool === 'select' && selectedShapeId && dragStart) {
              const dx = point.x - dragStart.x;
              const dy = point.y - dragStart.y;

              setShapes(shapes.map(shape => {
                if (shape.id !== selectedShapeId) return shape;

                switch (shape.type) {
                  case 'point':
                    return { ...shape, x: shape.x + dx, y: shape.y + dy };
                  case 'line':
                    return { 
                      ...shape, 
                      start: { x: shape.start.x + dx, y: shape.start.y + dy },
                      end: { x: shape.end.x + dx, y: shape.end.y + dy }
                    };
                  case 'circle':
                    return { ...shape, center: { x: shape.center.x + dx, y: shape.center.y + dy } };
                  case 'triangle':
                    return {
                      ...shape,
                      points: [
                        { x: shape.points[0].x + dx, y: shape.points[0].y + dy },
                        { x: shape.points[1].x + dx, y: shape.points[1].y + dy },
                        { x: shape.points[2].x + dx, y: shape.points[2].y + dy },
                      ]
                    };
                  case 'pencil':
                    return {
                      ...shape,
                      points: shape.points.map(p => ({ x: p.x + dx, y: p.y + dy }))
                    };
                  default:
                    return shape;
                }
              }));
              setDragStart(point);
              return;
            }

            if (!currentShape) return;

            switch (tool) {
              case 'line':
                setCurrentShape({ ...currentShape, end: point });
                break;
              case 'circle':
                const radius = getDistance(currentShape.center, point);
                setCurrentShape({ ...currentShape, radius });
                break;
              case 'triangle':
                const start = currentShape.points[0];
                const width = point.x - start.x;
                const p2 = { x: start.x - width, y: point.y };
                const p3 = { x: start.x + width, y: point.y };
                setCurrentShape({ ...currentShape, points: [start, p2, p3] });
                break;
              case 'pencil':
                const lastPoint = currentShape.points[currentShape.points.length - 1];
                if (getDistance(lastPoint, point) > 2) {
                  setCurrentShape({
                    ...currentShape,
                    points: [...currentShape.points, point]
                  });
                }
                break;
            }
          };

          const handleMouseUp = () => {
            if (isDrawing) {
              if (tool === 'select') {
                if (selectedShapeId) {
                   addToHistory(shapes);
                }
              } else if (currentShape) {
                const newShapes = [...shapes, currentShape];
                setShapes(newShapes);
                addToHistory(newShapes);
                setCurrentShape(null);
              }
            }
            setIsDrawing(false);
            setDragStart(null);
          };

          const renderShape = (shape) => {
            const isSelected = selectedShapeId === shape.id;
            const style = { 
                cursor: tool === 'select' ? 'move' : 'default',
                filter: isSelected ? 'drop-shadow(0 0 4px rgba(59, 130, 246, 0.6))' : 'none'
            };
            const stroke = isSelected ? '#2563eb' : (shape.color || '#3b82f6');

            switch (shape.type) {
              case 'point':
                return (
                  <circle
                    key={shape.id}
                    data-id={shape.id}
                    cx={shape.x}
                    cy={shape.y}
                    r={shape.strokeWidth}
                    fill={stroke}
                    style={style}
                    pointerEvents="all"
                  />
                );
              case 'line':
                return (
                  <line
                    key={shape.id}
                    data-id={shape.id}
                    x1={shape.start.x}
                    y1={shape.start.y}
                    x2={shape.end.x}
                    y2={shape.end.y}
                    stroke={stroke}
                    strokeWidth={shape.strokeWidth}
                    strokeLinecap="round"
                    style={style}
                    pointerEvents="stroke"
                  />
                );
              case 'circle':
                return (
                  <circle
                    key={shape.id}
                    data-id={shape.id}
                    cx={shape.center.x}
                    cy={shape.center.y}
                    r={shape.radius}
                    stroke={stroke}
                    strokeWidth={shape.strokeWidth}
                    fill="transparent"
                    style={style}
                    pointerEvents="stroke"
                  />
                );
              case 'triangle':
                const [p1, p2, p3] = shape.points;
                return (
                  <polygon
                    key={shape.id}
                    data-id={shape.id}
                    points={`${p1.x},${p1.y} ${p2.x},${p2.y} ${p3.x},${p3.y}`}
                    stroke={stroke}
                    strokeWidth={shape.strokeWidth}
                    fill="transparent"
                    strokeLinejoin="round"
                    style={style}
                    pointerEvents="stroke"
                  />
                );
              case 'pencil':
                const d = `M ${shape.points.map(p => `${p.x} ${p.y}`).join(' L ')}`;
                return (
                  <path
                    key={shape.id}
                    data-id={shape.id}
                    d={d}
                    stroke={stroke}
                    strokeWidth={shape.strokeWidth}
                    fill="none"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    style={style}
                    pointerEvents="stroke"
                  />
                );
              default:
                return null;
            }
          };

          return (
            <svg
              ref={svgRef}
              className={`w-full h-full block touch-none select-none ${tool === 'select' ? 'cursor-default' : 'cursor-crosshair'}`}
              onMouseDown={handleMouseDown}
              onMouseMove={handleMouseMove}
              onMouseUp={handleMouseUp}
              onMouseLeave={handleMouseUp}
            >
              {shapes.map(renderShape)}
              {currentShape && (
                <g opacity="0.6">
                    {renderShape(currentShape)}
                </g>
              )}
            </svg>
          );
        };

        // App
        const App = () => {
          const [shapes, setShapes] = useState([]);
          const [tool, setTool] = useState('select');
          const [showGrid, setShowGrid] = useState(true);
          
          const [history, setHistory] = useState({
            past: [],
            present: [],
            future: []
          });

          const addToHistory = useCallback((newShapes) => {
            setHistory(curr => ({
              past: [...curr.past, curr.present],
              present: newShapes,
              future: []
            }));
            setShapes(newShapes);
          }, []);

          const undo = useCallback(() => {
            setHistory(curr => {
              if (curr.past.length === 0) return curr;
              const previous = curr.past[curr.past.length - 1];
              const newPast = curr.past.slice(0, -1);
              setShapes(previous);
              return {
                past: newPast,
                present: previous,
                future: [curr.present, ...curr.future]
              };
            });
          }, []);

          const redo = useCallback(() => {
            setHistory(curr => {
              if (curr.future.length === 0) return curr;
              const next = curr.future[0];
              const newFuture = curr.future.slice(1);
              setShapes(next);
              return {
                past: [...curr.past, curr.present],
                present: next,
                future: newFuture
              };
            });
          }, []);

          const clearBoard = useCallback(() => {
            addToHistory([]);
          }, [addToHistory]);

          useEffect(() => {
            const handleKeyDown = (e) => {
              if ((e.metaKey || e.ctrlKey) && e.key === 'z') {
                e.preventDefault();
                if (e.shiftKey) {
                  redo();
                } else {
                  undo();
                }
              } else if ((e.metaKey || e.ctrlKey) && e.key === 'y') {
                e.preventDefault();
                redo();
              }
            };
            window.addEventListener('keydown', handleKeyDown);
            return () => window.removeEventListener('keydown', handleKeyDown);
          }, [undo, redo]);

          return (
            <div className="w-screen h-screen relative overflow-hidden bg-slate-50 text-slate-800">
              {showGrid && <div className="absolute inset-0 grid-bg pointer-events-none opacity-50" />}
              <div className="absolute top-4 left-4 z-40 bg-white/80 backdrop-blur px-4 py-2 rounded-xl shadow-sm border border-slate-200 pointer-events-none">
                 <h1 className="font-bold text-slate-800 flex items-center gap-2">
                    <span className="w-3 h-3 rounded-full bg-blue-500"></span>
                    GeoCanvas Pro
                 </h1>
              </div>
              <Canvas 
                tool={tool}
                shapes={shapes}
                setShapes={setShapes}
                addToHistory={addToHistory}
                snapEnabled={showGrid}
              />
              <Toolbar 
                currentTool={tool}
                setTool={setTool}
                canUndo={history.past.length > 0}
                canRedo={history.future.length > 0}
                onUndo={undo}
                onRedo={redo}
                onClear={clearBoard}
                showGrid={showGrid}
                toggleGrid={() => setShowGrid(!showGrid)}
              />
              <div className="absolute bottom-4 left-4 z-30 text-xs text-slate-400 select-none pointer-events-none">
                {tool === 'select' ? 'Click shape to drag' : 'Click & drag to draw'} • Grid Snapping: {showGrid ? 'On' : 'Off'}
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
