<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快乐几何工坊 - 教学逻辑终极版</title>
    <style>
        :root {
            /* 马卡龙快乐配色 */
            --bg-cream: #FFFBF0;
            --card-white: #FFFFFF;

            /* 玩具配色 */
            --toy-red: #FF5E57;
            /* 西瓜红：底面/周长 */
            --toy-blue: #0FB9B1;
            /* 天空蓝：侧面 */
            --toy-yellow: #FFDD59;
            /* 柠檬黄：高光/装饰 */
            --toy-dark: #1E272E;
            /* 深色文字 */
            --ghost-grey: #b2bec3;
            /* 幽灵圆柱颜色 */

            /* 阴影 */
            --shadow-clay: 0 12px 24px rgba(0, 0, 0, 0.06);
            --shadow-pop: 0 6px 0 rgba(0, 0, 0, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-cream);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(255, 94, 87, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(15, 185, 177, 0.1) 0%, transparent 20%);
            font-family: 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            color: var(--toy-dark);
            display: flex;
            height: 100vh;
        }

        /* --- 左侧软泥卡片 --- */
        .control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            bottom: 20px;
            width: 400px;
            background: var(--card-white);
            border: 3px solid #F0F0F0;
            border-radius: 32px;
            padding: 24px;
            box-shadow: var(--shadow-clay);
            display: flex;
            flex-direction: column;
            z-index: 20;
            overflow-y: auto;
            transition: transform 0.3s;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 900;
            margin: 0;
            color: var(--toy-blue);
            text-shadow: 2px 2px 0px rgba(15, 185, 177, 0.2);
        }

        .subtitle {
            font-size: 0.85rem;
            color: #999;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* 控件组 */
        .control-group {
            margin-bottom: 20px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 1rem;
            font-weight: 800;
            color: var(--toy-dark);
        }

        .val-badge {
            background: var(--toy-dark);
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
        }

        /* 糖果滑块 */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            cursor: pointer;
            height: 24px;
            margin: 5px 0;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 12px;
            background: #EEEEEE;
            border-radius: 10px;
            border: 2px solid white;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 22px;
            width: 22px;
            border-radius: 50%;
            background: var(--toy-blue);
            border: 3px solid white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            margin-top: -7px;
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        #input-r::-webkit-slider-thumb {
            background: var(--toy-red);
        }

        #input-unfold::-webkit-slider-thumb {
            background: var(--toy-yellow);
        }

        /* --- 数学推导看板 (Logic Board) --- */
        .deduction-board {
            margin-top: auto;
            background: #F8F9FA;
            border-radius: 20px;
            padding: 16px;
            border: 2px dashed #E0E0E0;
            position: relative;
            min-height: 140px;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        .board-title {
            font-size: 0.8rem;
            color: #AAA;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logic-step {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s;
        }

        .logic-step.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* 逻辑映射表 (Logic Mapping Table) */
        .mapping-table {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 8px;
            background: white;
            border-radius: 12px;
            padding: 10px;
            margin-top: 10px;
            text-align: center;
            align-items: center;
            border: 1px solid #eee;
        }

        .map-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .map-icon {
            font-size: 1.2rem;
        }

        .map-label {
            font-size: 0.7rem;
            color: #888;
            font-weight: 700;
        }

        .map-arrow {
            color: var(--toy-yellow);
            font-size: 1.2rem;
            font-weight: 900;
        }

        .relation-box {
            font-size: 0.85rem;
            margin-top: 8px;
            background: #fdfdfd;
            border-radius: 8px;
            padding: 6px;
        }

        .relation-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px dashed #eee;
        }

        .relation-row:last-child {
            border-bottom: none;
        }

        .highlight-red {
            color: var(--toy-red);
            font-weight: 800;
            font-family: 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif;
        }

        .highlight-blue {
            color: var(--toy-blue);
            font-weight: 800;
            font-family: 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif;
        }

        /* 重播按钮 */
        .btn-replay {
            margin-top: 10px;
            background: var(--toy-dark);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: transform 0.1s;
        }

        .btn-replay:hover {
            transform: scale(1.05);
        }

        .btn-replay:active {
            transform: scale(0.95);
        }

        /* --- 3D 舞台区域 --- */
        .stage-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 2000px;
            cursor: grab;
            position: relative;
            margin-left: 420px;
            overflow: hidden;
        }

        .stage-area:active {
            cursor: grabbing;
        }

        .scene {
            width: 0;
            height: 0;
            transform-style: preserve-3d;
            transform: rotateX(-20deg) rotateY(-30deg);
            transition: transform 0.1s linear;
        }

        /* --- 3D 物体 (Main & Ghost) --- */

        /* 修复背面消失问题：所有3D元素添加 visible */
        .strip,
        .base,
        .ghost-strip,
        .ghost-base {
            position: absolute;
            transform-style: preserve-3d;
            backface-visibility: visible !important;
        }

        /* 主模型样式 */
        .strip {
            background: linear-gradient(90deg, var(--toy-blue), #45EBE3 50%, var(--toy-blue));
            outline: 1px solid var(--toy-blue);
            /* 消除缝隙 */
            z-index: 2;
            /* 主模型在幽灵之上 */
        }

        .base {
            background: radial-gradient(circle at 30% 30%, #FF8F8A, var(--toy-red));
            border-radius: 50%;
            border: 2px solid white;
            box-sizing: border-box;
            z-index: 3;
        }

        /* 锚点逻辑 */
        .base-top {
            bottom: 100%;
            transform-origin: bottom center;
            margin-bottom: -1px;
        }

        .base-bottom {
            top: 100%;
            transform-origin: top center;
            margin-top: -1px;
        }

        /* 幽灵圆柱 (Ghost Cylinder) 样式 */
        .ghost-strip {
            background: transparent;
            border-top: 1px dashed var(--ghost-grey);
            border-bottom: 1px dashed var(--ghost-grey);
            /* 仅显示顶部和底部边框，模拟线框感 */
            pointer-events: none;
            z-index: 1;
        }

        .ghost-strip.ghost-outline {
            /* 给某些特定的strip加竖线，避免太乱 */
            border-left: 1px dashed var(--ghost-grey);
            border-right: 1px dashed var(--ghost-grey);
        }

        .ghost-base {
            background: transparent;
            border-radius: 50%;
            border: 2px dashed var(--ghost-grey);
            box-sizing: border-box;
            z-index: 1;
        }

        .ghost-base-top {
            bottom: 100%;
            margin-bottom: -1px;
            transform: rotateX(90deg) translateY(50%);
            transform-origin: bottom center;
        }

        /* 这里的定位需要稍微调整，复用主模型的逻辑最稳妥 */

        /* 标注系统 */
        .radius-line {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50%;
            height: 2px;
            background: white;
            transform-origin: left center;
            transform: rotate(-45deg);
            pointer-events: none;
        }

        .radius-label {
            position: absolute;
            right: 20%;
            top: -20px;
            color: white;
            font-family: 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif;
            font-weight: bold;
            font-size: 14px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .height-label-3d {
            position: absolute;
            right: -30px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--toy-dark);
            color: white;
            padding: 4px 10px;
            border-radius: 10px;
            font-family: 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif;
            border: 2px solid white;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .length-label-3d {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--toy-dark);
            color: var(--toy-yellow);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            font-weight: 800;
            border: 3px solid white;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .length-label-3d span {
            font-family: 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif;
            font-size: 1.1rem;
            margin-left: 5px;
        }

        .tracer {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: white;
            border: 3px solid var(--toy-yellow);
            box-shadow: 0 0 0 2px var(--toy-dark);
            display: none;
            z-index: 100;
        }

        .hint-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.8);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            font-size: 0.85rem;
            color: #888;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div class="control-panel">
        <h1>📐 快乐几何工坊</h1>
        <div class="subtitle">Happy Geometry Workshop</div>

        <div class="control-group">
            <div class="label-row">
                <span>半径 (r)</span>
                <span id="val-r" class="val-badge">40</span>
            </div>
            <input type="range" id="input-r" min="30" max="70" value="40">

            <div class="label-row">
                <span>高度 (h)</span>
                <span id="val-h" class="val-badge">120</span>
            </div>
            <input type="range" id="input-h" min="80" max="200" value="120">
        </div>

        <div class="control-group">
            <div class="label-row" style="color: var(--toy-blue)">
                <span>展开进度</span>
            </div>
            <input type="range" id="input-unfold" min="0" max="100" value="0" step="0.5">
        </div>

        <!-- 逻辑推导看板 -->
        <div class="deduction-board">
            <div class="board-title">💡 思考时间 (Think Time)</div>

            <!-- A: 初始态 -->
            <div id="logic-phase-a" class="logic-step active">
                <p>准备好剪刀了吗？让我们把圆柱侧面剪开！</p>
                <div style="font-size: 2rem; text-align: center; margin-top: 10px;">✂️</div>
            </div>

            <!-- B: 过渡态 -->
            <div id="logic-phase-b" class="logic-step">
                <p>正在展开... 注意看灰色的虚线圆柱（那是它原来的样子）！</p>
            </div>

            <!-- C: 结论态 (含映射表) -->
            <div id="logic-phase-c" class="logic-step">
                <!-- 映射表 -->
                <div class="mapping-table">
                    <div class="map-col">
                        <span class="map-icon">🥤</span>
                        <span class="map-label">侧面卷曲</span>
                    </div>
                    <div class="map-col">
                        <span class="map-arrow">➡️</span>
                        <span class="map-label">展开</span>
                    </div>
                    <div class="map-col">
                        <span class="map-icon">📄</span>
                        <span class="map-label">长方形</span>
                    </div>
                </div>

                <div class="relation-box">
                    <div class="relation-row">
                        <span>长方形的宽</span>
                        <span>↔</span>
                        <span class="highlight-blue">高 h</span>
                    </div>
                    <div class="relation-row">
                        <span>长方形的长</span>
                        <span>↔</span>
                        <span class="highlight-red">底面周长 C</span>
                    </div>
                </div>

                <button class="btn-replay" id="btn-replay">
                    <span>🔄</span> 重播推理动画
                </button>
            </div>
        </div>
    </div>

    <div class="stage-area" id="stage">
        <div class="scene" id="scene">
            <!-- 幽灵组 (参照物) -->
            <div id="ghost-group" style="transform-style: preserve-3d;"></div>
            <!-- 主模型组 -->
            <div id="cylinder-group" style="transform-style: preserve-3d;"></div>
        </div>

        <div class="hint-bar">
            <span>🖐️ 拖拽旋转</span>
            <span>🖱️ 滚轮缩放</span>
        </div>
    </div>

    <script>
        const config = {
            segments: 64,
            verifySpeed: 2500
        };

        const state = {
            r: 40,
            h: 120,
            unfold: 0,
            rotX: -20,
            rotY: -30,
            zoom: 0.9,
            hasAutoVerified: false
        };

        const els = {
            group: document.getElementById('cylinder-group'),
            ghostGroup: document.getElementById('ghost-group'),
            scene: document.getElementById('scene'),
            stage: document.getElementById('stage'),
            inputs: {
                r: document.getElementById('input-r'),
                h: document.getElementById('input-h'),
                unfold: document.getElementById('input-unfold')
            },
            displays: {
                r: document.getElementById('val-r'),
                h: document.getElementById('val-h')
            },
            logicSteps: {
                a: document.getElementById('logic-phase-a'),
                b: document.getElementById('logic-phase-b'),
                c: document.getElementById('logic-phase-c')
            },
            btnReplay: document.getElementById('btn-replay')
        };

        // --- 初始化模型 ---
        function initModel() {
            // 清空
            els.group.innerHTML = '';
            els.ghostGroup.innerHTML = '';

            const centerIndex = Math.floor(config.segments / 2);

            // 生成主模型 和 幽灵模型
            for (let i = 0; i < config.segments; i++) {
                // 1. 主模型 Strip
                const strip = document.createElement('div');
                strip.className = 'strip';
                strip.id = `strip-${i}`;

                // 2. 幽灵模型 Strip
                const ghostStrip = document.createElement('div');
                ghostStrip.className = 'ghost-strip';
                ghostStrip.id = `ghost-strip-${i}`;
                // 每隔8个显示一个竖线，避免虚线太密集
                if (i % 8 === 0) ghostStrip.classList.add('ghost-outline');

                // 3. 锚点逻辑 & 标注 (仅主模型需要)
                if (i === centerIndex) {
                    // --- 主模型 Bases ---
                    const topBase = document.createElement('div');
                    topBase.className = 'base base-top';
                    topBase.id = 'base-top';

                    const radiusLine = document.createElement('div');
                    radiusLine.className = 'radius-line';
                    radiusLine.innerHTML = '<span class="radius-label">r</span>';
                    topBase.appendChild(radiusLine);

                    const dotCircle = document.createElement('div');
                    dotCircle.className = 'tracer';
                    dotCircle.id = 'tracer-circle';
                    topBase.appendChild(dotCircle);

                    strip.appendChild(topBase);

                    const bottomBase = document.createElement('div');
                    bottomBase.className = 'base base-bottom';
                    bottomBase.id = 'base-bottom';
                    strip.appendChild(bottomBase);

                    const dotRect = document.createElement('div');
                    dotRect.className = 'tracer';
                    dotRect.id = 'tracer-rect';
                    dotRect.style.top = '-6px';
                    strip.appendChild(dotRect);

                    const lenLabel = document.createElement('div');
                    lenLabel.className = 'length-label-3d';
                    lenLabel.id = 'label-length';
                    lenLabel.innerHTML = '长 = <span>2πr</span>';
                    strip.appendChild(lenLabel);

                    // --- 幽灵模型 Bases (始终保持卷起态位置) ---
                    // Ghost Top Base
                    const ghostTop = document.createElement('div');
                    ghostTop.className = 'ghost-base';
                    ghostTop.id = 'ghost-base-top';
                    ghostStrip.appendChild(ghostTop); // 挂在幽灵的 center strip 上

                    // Ghost Bottom Base
                    const ghostBottom = document.createElement('div');
                    ghostBottom.className = 'ghost-base';
                    ghostBottom.id = 'ghost-base-bottom';
                    ghostStrip.appendChild(ghostBottom);
                }

                if (i === config.segments - 1) {
                    const hLabel = document.createElement('div');
                    hLabel.className = 'height-label-3d';
                    hLabel.id = 'label-height';
                    hLabel.innerHTML = 'h';
                    strip.appendChild(hLabel);
                }

                els.group.appendChild(strip);
                els.ghostGroup.appendChild(ghostStrip);
            }
        }

        // --- 渲染循环 ---
        function render() {
            const { r, h, unfold } = state;
            const segs = config.segments;

            // 数据计算
            const d = r * 2;
            const C = Math.PI * d;
            const segmentWidth = (C / segs);
            const centerIndex = Math.floor(segs / 2);

            els.displays.r.textContent = r;
            els.displays.h.textContent = h;

            updateLogicBoard(unfold);

            // --- 几何参数 ---
            const totalAngle = 360 * (1 - unfold);
            const anglePerSeg = totalAngle / segs;
            const angleRad = anglePerSeg * Math.PI / 180;

            let currentR;
            if (Math.abs(angleRad) < 0.0001) currentR = Infinity;
            else currentR = segmentWidth / angleRad;

            // --- Ghost 参数 (永远是圆柱态 unfold=0) ---
            // 幽灵圆柱的半径 R0
            const ghostR = C / (2 * Math.PI); // 即 r
            const ghostAnglePerSeg = 360 / segs;
            const ghostAngleRad = ghostAnglePerSeg * Math.PI / 180;

            for (let i = 0; i < segs; i++) {
                // --- 更新主模型 ---
                const strip = document.getElementById(`strip-${i}`);
                strip.style.width = (segmentWidth + 0.5) + 'px';
                strip.style.height = h + 'px';

                const offsetIdx = i - centerIndex;
                let transform = '';

                if (currentR === Infinity) {
                    const x = offsetIdx * segmentWidth;
                    transform = `translateX(${x}px)`;
                } else {
                    const alpha = offsetIdx * angleRad;
                    const x = currentR * Math.sin(alpha);
                    const z = currentR * Math.cos(alpha) - currentR;
                    const rotY = offsetIdx * anglePerSeg;
                    transform = `translateX(${x}px) translateZ(${z}px) rotateY(${rotY}deg)`;
                }
                strip.style.transform = transform;

                // --- 更新幽灵模型 (始终保持卷起) ---
                const ghostStrip = document.getElementById(`ghost-strip-${i}`);
                ghostStrip.style.width = (segmentWidth + 0.5) + 'px';
                ghostStrip.style.height = h + 'px';

                // 幽灵计算：始终围绕 centerIndex 卷曲
                // 位置保持在圆柱原位 (Z轴需要偏移 -r)
                // 我们的坐标系中：展开点(Z=0)是切线。
                // 圆柱卷起时，CenterStrip在 (0,0,0) (对应切点)，圆心在 (0,0,-r)。

                const gAlpha = offsetIdx * ghostAngleRad;
                const gx = ghostR * Math.sin(gAlpha);
                const gz = ghostR * Math.cos(gAlpha) - ghostR;
                const gRotY = offsetIdx * ghostAnglePerSeg;

                ghostStrip.style.transform = `translateX(${gx}px) translateZ(${gz}px) rotateY(${gRotY}deg)`;
            }

            // --- 更新 Bases (主模型) ---
            const hingeAngle = 90 * (1 - unfold);
            const topBase = document.getElementById('base-top');
            const bottomBase = document.getElementById('base-bottom');

            if (topBase && bottomBase) {
                const size = r * 2;
                [topBase, bottomBase].forEach(b => {
                    b.style.width = size + 'px'; b.style.height = size + 'px';
                });
                topBase.style.transform = `translateX(-50%) rotateX(${hingeAngle}deg)`;
                bottomBase.style.transform = `translateX(-50%) rotateX(${-hingeAngle}deg)`;
            }

            // --- 更新 Ghost Bases (始终垂直) ---
            const ghostTop = document.getElementById('ghost-base-top');
            const ghostBottom = document.getElementById('ghost-base-bottom');
            if (ghostTop && ghostBottom) {
                const size = r * 2;
                [ghostTop, ghostBottom].forEach(b => {
                    b.style.width = size + 'px'; b.style.height = size + 'px';
                    b.style.position = 'absolute';
                    b.style.left = '50%';
                });
                // Ghost Bases 挂载在 Ghost Center Strip 上
                // Center Strip 在原点，且垂直。
                // Bases 需要 rotateX(90) 盖住。

                ghostTop.style.bottom = '100%';
                ghostTop.style.transformOrigin = 'bottom center';
                ghostTop.style.marginBottom = '-1px';
                ghostTop.style.transform = `translateX(-50%) rotateX(90deg)`;

                ghostBottom.style.top = '100%';
                ghostBottom.style.transformOrigin = 'top center';
                ghostBottom.style.marginTop = '-1px';
                ghostBottom.style.transform = `translateX(-50%) rotateX(-90deg)`;
            }

            // --- 标签控制 ---
            const labelH = document.getElementById('label-height');
            if (labelH) labelH.style.opacity = unfold > 0.2 ? 1 : 0;

            const labelL = document.getElementById('label-length');
            if (labelL) {
                labelL.style.opacity = unfold > 0.9 ? 1 : 0;
                labelL.style.transform = `translateX(-50%) translateY(${h / 2 + 20}px)`;
            }
        }

        // --- 逻辑看板 ---
        function updateLogicBoard(u) {
            [els.logicSteps.a, els.logicSteps.b, els.logicSteps.c].forEach(el => el.classList.remove('active'));

            if (u < 0.1) {
                els.logicSteps.a.classList.add('active');
            } else if (u < 0.95) {
                els.logicSteps.b.classList.add('active');
            } else {
                els.logicSteps.c.classList.add('active');
                if (!state.hasAutoVerified) {
                    startVerify();
                    state.hasAutoVerified = true;
                }
            }
        }

        // --- 验证动画 (重播支持) ---
        let verifyRaf;
        function startVerify() {
            if (verifyRaf) cancelAnimationFrame(verifyRaf); // 防止叠加

            const tCircle = document.getElementById('tracer-circle');
            const tRect = document.getElementById('tracer-rect');
            tCircle.style.display = 'block';
            tRect.style.display = 'block';

            const startTime = performance.now();
            const { r } = state;
            const C = Math.PI * 2 * r;

            function animate(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / config.verifySpeed, 1);

                // Rect Tracer: -C/2 -> C/2
                const rectX = -C / 2 + (C * progress);
                tRect.style.transform = `translate3d(${rectX}px, -6px, 10px)`;

                // Circle Tracer: -90deg -> 270deg
                const startAngle = -Math.PI / 2;
                const totalRot = 2 * Math.PI;
                const currentAngle = startAngle + (totalRot * progress);
                const dotX = r + r * Math.cos(currentAngle);
                const dotY = r + r * Math.sin(currentAngle);

                tCircle.style.left = (dotX - 6) + 'px';
                tCircle.style.top = (dotY - 6) + 'px';

                if (progress < 1) {
                    verifyRaf = requestAnimationFrame(animate);
                }
            }
            verifyRaf = requestAnimationFrame(animate);
        }

        // --- 事件监听 ---
        function handleInput() {
            state.r = parseInt(els.inputs.r.value);
            state.h = parseInt(els.inputs.h.value);
            state.unfold = parseFloat(els.inputs.unfold.value) / 100;
            if (state.unfold < 0.9) state.hasAutoVerified = false;
            render();
        }

        Object.values(els.inputs).forEach(input => input.addEventListener('input', handleInput));
        els.btnReplay.addEventListener('click', startVerify);

        let isDragging = false, lastX, lastY;
        els.stage.addEventListener('mousedown', e => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', e => {
            if (!isDragging) return;
            const dx = e.clientX - lastX;
            const dy = e.clientY - lastY;
            state.rotY += dx * 0.4;
            state.rotX -= dy * 0.4;
            state.rotX = Math.max(-85, Math.min(85, state.rotX));
            updateScene();
            lastX = e.clientX;
            lastY = e.clientY;
        });

        els.stage.addEventListener('wheel', e => {
            e.preventDefault();
            state.zoom += e.deltaY * -0.001;
            state.zoom = Math.min(Math.max(0.5, state.zoom), 2.0);
            updateScene();
        });

        function updateScene() {
            els.scene.style.transform = `scale(${state.zoom}) rotateX(${state.rotX}deg) rotateY(${state.rotY}deg)`;
        }

        initModel();
        render();

    </script>
</body>

</html>
