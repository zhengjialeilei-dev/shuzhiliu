<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>比例尺 - 交互探索</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; --primary-bg: #eef2ff;
            --accent: #f59e0b; --accent-bg: #fffbeb;
            --success: #10b981; --danger: #ef4444;
            --bg: #f8fafc; --card: #ffffff;
            --text: #1e293b; --text-gray: #64748b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans SC', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .app-header {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white; padding: 20px 24px; text-align: center;
            box-shadow: 0 4px 20px rgba(99,102,241,0.3);
        }
        .app-header h1 { font-size: 1.6rem; font-weight: 700; }
        .app-header p { font-size: 0.9rem; opacity: 0.85; margin-top: 4px; }
        .main { max-width: 920px; margin: 0 auto; padding: 20px 16px 40px; }
        .card {
            background: var(--card); border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06); padding: 24px;
            margin-bottom: 20px; border: 1px solid #f1f5f9;
        }
        .card-title {
            font-size: 1.15rem; font-weight: 700; color: var(--primary);
            margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
        }

        /* 比例尺可视化 */
        .ruler-container {
            display: flex; align-items: center; gap: 12px;
            margin: 16px 0; padding: 16px; background: #f1f5f9;
            border-radius: 12px;
        }
        .ruler-bar {
            flex: 1; height: 40px; background: white; border-radius: 8px;
            position: relative; border: 2px solid #cbd5e1; overflow: hidden;
        }
        .ruler-fill {
            height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-bg));
            border-radius: 6px; transition: width 0.3s;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 700; font-size: 0.85rem;
        }
        .ruler-label { font-weight: 700; min-width: 80px; text-align: center; font-size: 0.95rem; }

        /* 交互区 */
        .formula-box {
            background: var(--primary-bg); border-radius: 14px; padding: 20px;
            text-align: center; font-size: 1.2rem; font-weight: 700;
            margin: 16px 0; border: 2px dashed var(--primary);
        }
        .formula-box .val { color: var(--primary); font-size: 1.4rem; }
        .formula-box .unit { font-size: 0.9rem; color: var(--text-gray); font-weight: 500; }

        .input-group {
            display: flex; align-items: center; gap: 8px; margin: 12px 0;
        }
        .input-group label { font-weight: 600; min-width: 90px; font-size: 0.95rem; }
        .styled-input {
            flex: 1; padding: 10px 14px; border: 2px solid #e2e8f0;
            border-radius: 10px; font-size: 1rem; font-weight: 600;
            outline: none; transition: border-color 0.3s; font-family: inherit;
        }
        .styled-input:focus { border-color: var(--primary); }
        .styled-select {
            padding: 10px 14px; border: 2px solid #e2e8f0;
            border-radius: 10px; font-size: 1rem; font-weight: 600;
            outline: none; background: white; font-family: inherit;
        }

        .btn {
            padding: 10px 24px; border: none; border-radius: 10px;
            font-size: 1rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s; font-family: inherit;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #4f46e5; }
        .btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
        .btn-success { background: var(--success); color: white; }

        /* 地图模拟 */
        .map-container {
            position: relative; width: 100%; height: 320px;
            background: #e8f5e9; border-radius: 14px; overflow: hidden;
            border: 2px solid #a5d6a7; margin: 12px 0;
        }
        .map-grid {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .map-city {
            position: absolute; width: 12px; height: 12px;
            background: var(--danger); border: 2px solid white;
            border-radius: 50%; cursor: grab; z-index: 10;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .map-city:hover { transform: scale(1.3); }
        .map-city-label {
            position: absolute; font-size: 0.8rem; font-weight: 700;
            color: #1e293b; white-space: nowrap; pointer-events: none;
            text-shadow: 1px 1px 2px white; z-index: 11;
        }
        .map-line {
            position: absolute; z-index: 5;
        }
        .map-distance {
            position: absolute; z-index: 12; background: rgba(99,102,241,0.9);
            color: white; padding: 2px 10px; border-radius: 20px;
            font-size: 0.75rem; font-weight: 600; white-space: nowrap;
            pointer-events: none;
        }
        .map-scale-bar {
            position: absolute; bottom: 12px; left: 12px;
            background: rgba(255,255,255,0.9); border-radius: 8px;
            padding: 6px 12px; font-size: 0.8rem; font-weight: 600;
            display: flex; align-items: center; gap: 8px; z-index: 15;
        }
        .scale-line { height: 4px; background: var(--text); border-radius: 2px; }

        /* 练习 */
        .quiz-item {
            background: #f8fafc; border-radius: 12px; padding: 16px;
            margin: 10px 0; border: 2px solid #e2e8f0;
        }
        .quiz-item.correct { border-color: var(--success); background: #f0fdf4; }
        .quiz-item.wrong { border-color: var(--danger); background: #fef2f2; }
        .quiz-item .question-text { font-weight: 600; margin-bottom: 10px; }

        .conclusion-box {
            padding: 16px 20px; border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white; font-weight: 600; line-height: 1.8; margin-top: 12px;
        }
        .conclusion-box strong { color: #fde68a; }
    </style>
</head>
<body>
    <div class="app-header">
        <h1><i class="fas fa-ruler-combined"></i> 比例尺</h1>
        <p>图上距离 : 实际距离 = 比例尺</p>
    </div>

    <div class="main">
        <!-- 概念 -->
        <div class="card">
            <div class="card-title"><i class="fas fa-lightbulb"></i> 什么是比例尺</div>
            <div class="formula-box">
                比例尺 = <span class="val">图上距离</span> : <span class="val">实际距离</span>
            </div>
            <div style="text-align:center;color:var(--text-gray);margin:8px 0;">
                一幅图的图上距离和实际距离的比，叫做这幅图的<strong style="color:var(--primary)">比例尺</strong>。
            </div>

            <div class="ruler-container">
                <span class="ruler-label" style="color:var(--primary);">📐 图上</span>
                <div class="ruler-bar">
                    <div class="ruler-fill" id="map-ruler" style="width:30%;">1cm</div>
                </div>
            </div>
            <div class="ruler-container">
                <span class="ruler-label" style="color:var(--accent);">🌍 实际</span>
                <div class="ruler-bar" style="border-color:var(--accent);">
                    <div class="ruler-fill" id="real-ruler" style="width:100%;background:linear-gradient(90deg,#f59e0b,#fde68a);">50km</div>
                </div>
            </div>
            <div style="text-align:center;font-weight:700;color:var(--primary);margin:8px 0;">
                比例尺 = 1cm : 50km = 1 : <span id="scale-display">5,000,000</span>
            </div>
        </div>

        <!-- 换算器 -->
        <div class="card">
            <div class="card-title"><i class="fas fa-exchange-alt"></i> 比例尺换算器</div>

            <div style="display:flex;gap:8px;margin-bottom:12px;justify-content:center;flex-wrap:wrap;">
                <button class="btn btn-primary" onclick="setCalcMode('scale')" id="mode-scale">求比例尺</button>
                <button class="btn btn-outline" onclick="setCalcMode('real')" id="mode-real">求实际距离</button>
                <button class="btn btn-outline" onclick="setCalcMode('map')" id="mode-map">求图上距离</button>
            </div>

            <div id="calc-area">
                <div class="input-group">
                    <label>图上距离</label>
                    <input class="styled-input" id="calc-map" type="number" placeholder="输入数值" value="5">
                    <select class="styled-select" id="calc-map-unit">
                        <option value="0.01">mm</option>
                        <option value="0.01" selected>cm</option>
                        <option value="1">m</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>实际距离</label>
                    <input class="styled-input" id="calc-real" type="number" placeholder="输入数值" value="250">
                    <select class="styled-select" id="calc-real-unit">
                        <option value="0.01">cm</option>
                        <option value="1">m</option>
                        <option value="1000" selected>km</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>比例尺</label>
                    <span style="font-weight:700;font-size:1.2rem;color:var(--primary);" id="calc-scale-result">1 : 5,000,000</span>
                </div>
            </div>

            <div style="text-align:center;margin-top:12px;">
                <button class="btn btn-success" onclick="calcScale()"><i class="fas fa-calculator"></i> 计算</button>
            </div>
        </div>

        <!-- 模拟地图 -->
        <div class="card">
            <div class="card-title"><i class="fas fa-map-marked-alt"></i> 模拟地图测量</div>
            <p style="color:var(--text-gray);margin-bottom:8px;">拖动城市标记，查看实际距离：</p>

            <div style="display:flex;gap:8px;margin-bottom:8px;align-items:center;">
                <label style="font-weight:600;">比例尺：</label>
                <select class="styled-select" id="map-scale-select" onchange="updateMapScale()">
                    <option value="100000">1 : 100,000</option>
                    <option value="500000">1 : 500,000</option>
                    <option value="1000000">1 : 1,000,000</option>
                    <option value="5000000" selected>1 : 5,000,000</option>
                    <option value="10000000">1 : 10,000,000</option>
                </select>
            </div>

            <div class="map-container" id="map">
                <div class="map-grid"></div>
                <svg class="map-line" id="map-svg" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></svg>
                <div class="map-city" id="city-a" style="left:80px;top:100px;"></div>
                <div class="map-city-label" id="label-a" style="left:96px;top:90px;">北京</div>
                <div class="map-city" id="city-b" style="left:400px;top:200px;"></div>
                <div class="map-city-label" id="label-b" style="left:416px;top:190px;">上海</div>
                <div class="map-distance" id="map-dist" style="left:240px;top:140px;"></div>
                <div class="map-scale-bar">
                    <div class="scale-line" id="scale-bar-line" style="width:80px;"></div>
                    <span id="scale-bar-text">80km</span>
                </div>
            </div>
        </div>

        <!-- 练习 -->
        <div class="card">
            <div class="card-title"><i class="fas fa-pencil-alt"></i> 练一练</div>
            <div id="quiz-container"></div>
            <div style="display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap;">
                <button class="btn btn-success" onclick="checkQuiz()"><i class="fas fa-check"></i> 检查</button>
                <button class="btn btn-outline" onclick="genQuiz()"><i class="fas fa-redo"></i> 换题</button>
            </div>
            <div id="quiz-result" style="text-align:center;margin-top:12px;font-weight:700;"></div>
        </div>

        <div class="conclusion-box">
            <strong>比例尺公式：</strong><br>
            比例尺 = 图上距离 ÷ 实际距离<br>
            图上距离 = 实际距离 × 比例尺<br>
            实际距离 = 图上距离 ÷ 比例尺<br>
            <span style="opacity:0.8;font-size:0.9rem;">⚠️ 注意单位统一！比例尺不带单位。</span>
        </div>
    </div>

    <script>
        let calcMode = 'scale';
        let quizData = [];
        let mapScale = 5000000;

        // === 换算器 ===
        function setCalcMode(mode) {
            calcMode = mode;
            ['scale', 'real', 'map'].forEach(m => {
                const btn = document.getElementById('mode-' + m);
                btn.className = m === mode ? 'btn btn-primary' : 'btn btn-outline';
            });
            const mapInput = document.getElementById('calc-map');
            const realInput = document.getElementById('calc-real');
            mapInput.disabled = mode === 'map';
            realInput.disabled = mode === 'real';
            if (mode === 'map') { mapInput.value = ''; mapInput.placeholder = '待求'; }
            else { mapInput.placeholder = '输入数值'; }
            if (mode === 'real') { realInput.value = ''; realInput.placeholder = '待求'; }
            else { realInput.placeholder = '输入数值'; }
        }

        function calcScale() {
            const mapVal = parseFloat(document.getElementById('calc-map').value);
            const realVal = parseFloat(document.getElementById('calc-real').value);
            const mapUnit = parseFloat(document.getElementById('calc-map-unit').value);
            const realUnit = parseFloat(document.getElementById('calc-real-unit').value);

            const mapM = mapVal * mapUnit; // 转米
            const realM = realVal * realUnit; // 转米

            if (calcMode === 'scale') {
                if (!mapVal || !realVal || mapM <= 0) return;
                const ratio = realM / mapM;
                document.getElementById('calc-scale-result').textContent = '1 : ' + formatNum(Math.round(ratio));
            } else if (calcMode === 'real') {
                if (!mapVal) return;
                // 需要从scale解析
                const scaleMatch = document.getElementById('calc-scale-result').textContent.match(/1\s*:\s*([\d,]+)/);
                if (!scaleMatch) return;
                const scale = parseFloat(scaleMatch[1].replace(/,/g, ''));
                const realResult = mapM * scale;
                const realResultDisplay = realResult / realUnit;
                document.getElementById('calc-real').value = Math.round(realResultDisplay * 100) / 100;
            } else {
                if (!realVal) return;
                const scaleMatch = document.getElementById('calc-scale-result').textContent.match(/1\s*:\s*([\d,]+)/);
                if (!scaleMatch) return;
                const scale = parseFloat(scaleMatch[1].replace(/,/g, ''));
                const mapResult = realM / scale;
                const mapResultDisplay = mapResult / mapUnit;
                document.getElementById('calc-map').value = Math.round(mapResultDisplay * 1000) / 1000;
            }
        }

        function formatNum(n) { return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

        // === 地图 ===
        function updateMapScale() {
            mapScale = parseInt(document.getElementById('map-scale-select').value);
            updateMapDistance();
            updateScaleBar();
        }

        function updateMapDistance() {
            const a = document.getElementById('city-a');
            const b = document.getElementById('city-b');
            const dx = (parseFloat(b.style.left) - parseFloat(a.style.left));
            const dy = (parseFloat(b.style.top) - parseFloat(a.style.top));
            const pixDist = Math.sqrt(dx * dx + dy * dy);
            // 1px ≈ 某个cm，假设地图容器显示宽度对应某个比例
            const mapEl = document.getElementById('map');
            const mapWidth = mapEl.offsetWidth;
            // 假设整个地图宽度代表 500km * (mapScale/5000000)
            const kmPerPx = (mapScale * 100000 / mapWidth) / 100; // 粗略
            const realKm = (pixDist * mapScale / 100000 / mapWidth * 100).toFixed(1);
            // 简化：假设 1px = mapScale/100 cm 的实际距离
            const realDistKm = pixDist * mapScale / 100 / 100000;
            document.getElementById('map-dist').textContent = realDistKm.toFixed(1) + ' km';

            // 更新连线
            const svg = document.getElementById('map-svg');
            const ax = parseFloat(a.style.left) + 6;
            const ay = parseFloat(a.style.top) + 6;
            const bx = parseFloat(b.style.left) + 6;
            const by = parseFloat(b.style.top) + 6;
            svg.innerHTML = '<line x1="' + ax + '" y1="' + ay + '" x2="' + bx + '" y2="' + by + '" stroke="#6366f1" stroke-width="2" stroke-dasharray="6,4"/>';

            // 距离标签位置
            const dist = document.getElementById('map-dist');
            dist.style.left = ((ax + bx) / 2 - 30) + 'px';
            dist.style.top = ((ay + by) / 2 - 20) + 'px';
        }

        function updateScaleBar() {
            const mapWidth = document.getElementById('map').offsetWidth;
            const barPx = 80;
            const barKm = (barPx * mapScale / 100 / 100000).toFixed(0);
            document.getElementById('scale-bar-text').textContent = barKm + ' km';
        }

        // 拖拽
        let dragging = null;
        document.querySelectorAll('.map-city').forEach(city => {
            city.addEventListener('mousedown', e => { dragging = city; e.preventDefault(); });
            city.addEventListener('touchstart', e => { dragging = city; e.preventDefault(); }, { passive: false });
        });
        document.addEventListener('mousemove', e => { if (dragging) moveCity(e.clientX, e.clientY); });
        document.addEventListener('touchmove', e => { if (dragging) moveCity(e.touches[0].clientX, e.touches[0].clientY); });
        document.addEventListener('mouseup', () => dragging = null);
        document.addEventListener('touchend', () => dragging = null);

        function moveCity(cx, cy) {
            const map = document.getElementById('map');
            const rect = map.getBoundingClientRect();
            let x = cx - rect.left - 6;
            let y = cy - rect.top - 6;
            x = Math.max(6, Math.min(rect.width - 18, x));
            y = Math.max(6, Math.min(rect.height - 18, y));
            dragging.style.left = x + 'px';
            dragging.style.top = y + 'px';
            // 更新标签
            const id = dragging.id;
            const label = document.getElementById(id.replace('city', 'label'));
            label.style.left = (x + 16) + 'px';
            label.style.top = (y - 10) + 'px';
            updateMapDistance();
        }

        // === 练习 ===
        function genQuiz() {
            quizData = [];
            const types = ['findReal', 'findMap', 'findScale'];
            for (let i = 0; i < 4; i++) {
                const type = types[i % 3];
                const scale = [100000, 200000, 500000, 1000000, 2000000, 5000000][Math.floor(Math.random() * 6)];
                let mapCm, realCm;
                if (type === 'findScale' || type === 'findMap') {
                    mapCm = [2, 3, 4, 5, 6, 8, 10][Math.floor(Math.random() * 7)];
                    realCm = mapCm * scale;
                } else {
                    realCm = scale * [3, 5, 7, 10, 12][Math.floor(Math.random() * 5)];
                    mapCm = realCm / scale;
                }
                const realKm = realCm / 100000;
                quizData.push({ type, scale, mapCm, realCm, realKm, answer: type === 'findReal' ? realKm : type === 'findMap' ? mapCm : scale });
            }
            renderQuiz();
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            document.getElementById('quiz-result').textContent = '';
            quizData.forEach((q, i) => {
                let question = '';
                if (q.type === 'findReal') {
                    question = '在一幅比例尺 1:' + formatNum(q.scale) + ' 的地图上，量得 A、B 两地距离 ' + q.mapCm + ' cm，求实际距离（km）。';
                } else if (q.type === 'findMap') {
                    question = 'A、B 两地实际距离 ' + q.realKm + ' km，在比例尺 1:' + formatNum(q.scale) + ' 的地图上，应画多少 cm？';
                } else {
                    question = '在一幅地图上，' + q.mapCm + ' cm 代表实际 ' + q.realKm + ' km，求这幅图的比例尺。';
                }
                container.innerHTML += '<div class="quiz-item" id="qi-' + i + '"><div class="question-text">' + (i + 1) + '. ' + question + '</div><div style="display:flex;align-items:center;gap:8px;"><input class="styled-input" id="qa-' + i + '" type="number" placeholder="输入答案" autocomplete="off"><span style="font-weight:600;color:var(--text-gray);" id="qu-' + i + '">' + (q.type === 'findReal' ? 'km' : q.type === 'findMap' ? 'cm' : '（填比例尺分母）') + '</span></div></div>';
            });
        }

        function checkQuiz() {
            let c = 0, w = 0;
            quizData.forEach((q, i) => {
                const input = document.getElementById('qa-' + i);
                const card = document.getElementById('qi-' + i);
                const val = parseFloat(input.value);
                const correct = Math.abs(val - q.answer) < 0.1;
                card.classList.remove('correct', 'wrong');
                if (correct) { card.classList.add('correct'); c++; }
                else { card.classList.add('wrong'); w++; }
            });
            document.getElementById('quiz-result').innerHTML = '✅ ' + c + ' 对 &nbsp; ❌ ' + w + ' 错';
        }

        // Init
        updateMapDistance();
        updateScaleBar();
        genQuiz();
    </script>
</body>
</html>
