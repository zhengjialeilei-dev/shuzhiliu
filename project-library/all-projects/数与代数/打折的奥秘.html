                        <Gift size={32}/> 出门条 (Exit Ticket)
                        </h3>
                        <p className="text-2xl font-medium">“买一送一”相当于打几折？</p>
                        <button 
                        onClick={() => toggleAnswer(8, 'exit')}
                        className="mt-4 text-lg text-green-600 underline hover:text-green-800 font-bold"
                        >
                        查看答案
                        </button>
                        {showAnswer[`8-exit`] && (
                        <span className="ml-6 text-4xl font-bold text-green-700 animate-pulse">5折！</span>
                        )}
                    </div>

                    <div className="bg-orange-50 p-8 rounded-3xl border-l-8 border-orange-400">
                        <h3 className="text-2xl font-bold text-orange-800 mb-2">实践作业</h3>
                        <p className="text-xl">回家找一件打折商品，算出它到底为你省了多少零花钱。</p>
                    </div>
                    </div>
                )
                }
            ];

            const nextSlide = () => {
                if (currentSlide < slides.length - 1) {
                    setCurrentSlide(curr => curr + 1);
                    setShowAnswer({});
                }
            };

            const prevSlide = () => {
                if (currentSlide > 0) {
                    setCurrentSlide(curr => curr - 1);
                    setShowAnswer({});
                }
            };

            useEffect(() => {
                const handleKeyDown = (e) => {
                if (e.key === 'ArrowRight') nextSlide();
                if (e.key === 'ArrowLeft') prevSlide();
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [currentSlide]);

            return (
                <div className="w-full h-screen bg-gray-100 flex flex-col p-4 font-sans text-gray-800 box-border">
                {/* 铺满全屏的主容器 */}
                <div className="w-full h-full bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col relative border border-gray-200">
                    
                    {/* Header */}
                    {currentSlide !== 0 && (
                    <div className="bg-red-600 text-white px-8 py-5 flex justify-between items-center shadow-lg z-10 flex-shrink-0">
                        <h2 className="text-2xl font-bold truncate">{slides[currentSlide].title}</h2>
                        <div className="text-lg bg-red-700 px-4 py-1 rounded-full font-mono">
                        {currentSlide} / {slides.length - 1}
                        </div>
                    </div>
                    )}

                    {/* Content Area */}
                    <div className="flex-1 p-8 md:p-12 overflow-y-auto bg-slate-50 relative">
                        {slides[currentSlide].content}
                    </div>

                    {/* Navigation Bar */}
                    <div className="bg-white border-t border-gray-200 px-8 py-4 flex justify-between items-center flex-shrink-0">
                    <button 
                        onClick={prevSlide} 
                        disabled={currentSlide === 0}
                        className={`flex items-center gap-3 px-8 py-3 rounded-xl font-bold text-lg transition-all ${currentSlide === 0 
                        ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-gray-800 text-white hover:bg-gray-700 hover:scale-105'}`}
                    >
                        <ChevronLeft size={24} /> 上一页
                    </button>

                    <div className="flex gap-3">
                        {slides.map((_, idx) => (
                        <button 
                            key={idx}
                            onClick={() => {
                            setCurrentSlide(idx);
                            setShowAnswer({});
                            }}
                            className={`h-4 rounded-full transition-all duration-300 ${currentSlide === idx ? 'bg-red-600 w-12' : 'bg-gray-300 w-4 hover:bg-gray-400'}`}
                        />
                        ))}
                    </div>

                    <button 
                        onClick={nextSlide} 
                        disabled={currentSlide === slides.length - 1}
                        className={`flex items-center gap-3 px-8 py-3 rounded-xl font-bold text-lg transition-all ${currentSlide === slides.length - 1 
                        ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-red-600 text-white hover:bg-red-500 hover:scale-105'}`}
                    >
                        下一页 <ChevronRight size={24} />
                    </button>
                    </div>
                </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LessonSlides />);
    </script>
</body>
</html>
