<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字卡策略局</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { 
            font-family: 'Outfit', sans-serif; 
            margin: 0; padding: 0; overflow: hidden; user-select: none; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-color: #0b1120;
            background-image: 
                radial-gradient(ellipse at 80% 0%, rgba(120, 119, 198, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 20% 100%, rgba(56, 189, 248, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, #0b1120 0%, #020617 100%);
            color: #f8fafc; position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 20%; left: 30%;
            width: 40vw; height: 40vw;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.2) 0%, transparent 70%);
            filter: blur(60px);
            animation: float-bg 20s infinite ease-in-out alternate;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes float-bg {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(10vw, 5vh) scale(1.2); }
        }
        
        .game-title { 
            font-size: 4rem; font-weight: 800; margin-bottom: 2rem; 
            background: linear-gradient(90deg, #f87171, #60a5fa); background-clip: text; text-fill-color: transparent; 
            text-shadow: 0 10px 30px rgba(0,0,0,0.5); filter: drop-shadow(0 2px 10px rgba(255,255,255,0.2)); z-index: 2; 
        }
        .game-container { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 1200px; z-index: 1; }
        
        .status-area { 
            margin-bottom: 3rem; text-align: center; padding: 1.5rem 3rem; 
            background: rgba(15, 23, 42, 0.6); border-radius: 30px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255,255,255,0.1); border-top: 1px solid rgba(255, 255, 255, 0.2);
             transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        .status-area.red-winner { background: rgba(239, 68, 68, 0.1) !important; border: 1px solid rgba(239, 68, 68, 0.4); box-shadow: 0 10px 40px rgba(239, 68, 68, 0.3); }
        .status-area.blue-winner { background: rgba(59, 130, 246, 0.1) !important; border: 1px solid rgba(59, 130, 246, 0.4); box-shadow: 0 10px 40px rgba(59, 130, 246, 0.3); }

        .status-text { font-size: 1.8rem; font-weight: 700; color: #f8fafc; }
        .round-info { font-size: 1.2rem; color: #cbd5e1; font-weight: 600; margin-top: 8px; display: inline-block; padding: 4px 16px; background: rgba(255,255,255,0.1); border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); }
        
        .players-area { display: flex; justify-content: center; width: 100%; gap: 4rem; margin-bottom: 2rem; }
        .player {
            display: flex; flex-direction: column; align-items: center; padding: 2.5rem 2rem;
            background: rgba(30, 41, 59, 0.5); border-radius: 40px; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.1);
             width: 45vw; max-width: 500px; min-width: 320px; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .player:first-child { box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 0 30px rgba(239, 68, 68, 0.05), inset 0 0 0 1px rgba(239, 68, 68, 0.3); }
        .player:last-child { box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 0 30px rgba(59, 130, 246, 0.05), inset 0 0 0 1px rgba(59, 130, 246, 0.3); }
        .player h2 { font-size: 2.2rem; font-weight: 800; margin-bottom: 2rem; letter-spacing: 2px; }
        .player:first-child h2 { color: #f87171; text-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }
        .player:last-child h2 { color: #60a5fa; text-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
        
        .number-slots { display: flex; gap: 10px; justify-content: center; }
        .slot {
            width: 65px; height: 90px; border-radius: 30px; display: flex; align-items: center; justify-content: center;
            font-size: 2.8rem; font-weight: 800; background: rgba(15, 23, 42, 0.8);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1), 0 10px 20px rgba(0,0,0,0.3);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); cursor: default; color: #94a3b8;
        }
        .player:first-child .slot.clickable:hover { 
            transform: translateY(-8px) scale(1.05); background: rgba(15, 23, 42, 0.9); 
            box-shadow: 0 20px 35px rgba(239, 68, 68, 0.3), inset 0 0 0 2px #ef4444; 
        }
        .player:last-child .slot.clickable:hover { 
            transform: translateY(-8px) scale(1.05); background: rgba(15, 23, 42, 0.9); 
            box-shadow: 0 20px 35px rgba(59, 130, 246, 0.3), inset 0 0 0 2px #3b82f6; 
        }
        .player:first-child .slot.filled { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; box-shadow: 0 15px 30px rgba(239, 68, 68, 0.4), inset 0 0 0 1px rgba(255,255,255,0.4); text-shadow: 0 2px 4px rgba(0,0,0,0.3); transform: scale(1.05); }
        .player:last-child .slot.filled { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; box-shadow: 0 15px 30px rgba(59, 130, 246, 0.4), inset 0 0 0 1px rgba(255,255,255,0.4); text-shadow: 0 2px 4px rgba(0,0,0,0.3); transform: scale(1.05); }
        
        .current-card-area { display: flex; flex-direction: column; align-items: center; margin: -50px 0 50px; z-index: 100; transition: opacity 0.4s, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .current-card-area.hidden { opacity: 0; pointer-events: none; transform: translateY(40px) scale(0.8); }
        .current-card-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.2rem; color: #cbd5e1; background: rgba(255,255,255,0.1); padding: 6px 20px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1);  }
        .current-card {
            width: 150px; height: 200px; 
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03)); 
            border-radius: 30px; display: flex; align-items: center; justify-content: center;
            font-size: 7rem; font-weight: 800; color: #f8fafc; 
            text-shadow: 0 10px 20px rgba(0,0,0,0.5);
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 0 20px rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2); border-top: 1px solid rgba(255,255,255,0.4); border-left: 1px solid rgba(255,255,255,0.3);

        }
        @keyframes float-card { 0%, 100% { transform: translateY(0) rotate(-2deg) scale(1); } 50% { transform: translateY(-20px) rotate(2deg) scale(1.05); } }
        
        .restart-button {
            position: fixed; bottom: 40px; right: 40px; 
            background: rgba(15, 23, 42, 0.7); color: #f8fafc; 
            width: 70px; height: 70px; border-radius: 50%; font-size: 2.2rem; cursor: pointer;

            display: flex; align-items: center; justify-content: center;
        }

            transform: rotate(180deg) scale(1.15); 
            box-shadow: 0 25px 45px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,255,255,0.1); 
            background: rgba(30, 41, 59, 0.8); 
        }

  <section class="edu-brand-panel" aria-label="页面导语">
    <div class="edu-brand-kicker">课堂游戏 · EDU STUDIO</div>

    <div class="edu-brand-copy">
      <div><strong>任务目标：</strong>通过轮次式数字操作训练计算与策略判断。</div>
      <div><strong>操作提示：</strong>按页面的回合顺序进行操作，比较不同出牌策略的结果。</div>
      <div><strong>理解重点：</strong>游戏化场景能把运算规则转成可观察的决策过程。</div>
    </div>
</section>

  </aside>

<button type="button" class="edu-border-toggle" id="edu-border-toggle" aria-pressed="false" aria-label="隐藏说明框" title="隐藏说明框">-</button>

    <div class="game-container">

                
        <div class="current-card-area hidden" id="currentCardArea">
            <div class="current-card-title">当前卡片</div>
            <div class="current-card" id="currentCard"></div>
        </div>
        
        <div class="players-area">
            <div class="player" id="player1">
                <h2>红队</h2>
                <div class="number-slots" id="slots1">
                    <div class="slot" data-player="1" data-position="0"></div>
                    <div class="slot" data-player="1" data-position="1"></div>
                    <div class="slot" data-player="1" data-position="2"></div>
                    <div class="slot" data-player="1" data-position="3"></div>
                    <div class="slot" data-player="1" data-position="4"></div>

                </div>

            <div class="player" id="player2">
                <h2>蓝队</h2>
                <div class="number-slots" id="slots2">
                    <div class="slot" data-player="2" data-position="0"></div>
                    <div class="slot" data-player="2" data-position="1"></div>
                    <div class="slot" data-player="2" data-position="2"></div>
                    <div class="slot" data-player="2" data-position="3"></div>
                    <div class="slot" data-player="2" data-position="4"></div>
                    <div class="slot" data-player="2" data-position="5"></div>
                    <div class="slot" data-player="2" data-position="6"></div>
                </div>
            </div>
        </div>


        <div class="status-area" id="statusArea">
            <div class="status-text" id="statusText">准备开始游戏...</div>
            <div class="round-info" id="roundInfo">第1轮</div>
        </div>

    <button class="restart-button" id="restartButton" onclick="location.reload()">🔄</button>

    <script>
        let sharedCards = [];
        let player1Numbers = new Array(7).fill(null);
        let player2Numbers = new Array(7).fill(null);
        let currentCard = null;
        let player1Filled = false;
        let player2Filled = false;
        let gameRound = 0;

        // 初始化游戏
        function initGame() {
            // 创建共享的0-9卡片池
            sharedCards = [];
            for (let i = 0; i <= 9; i++) {
                sharedCards.push(i);
            }
            
            // 打乱卡片顺序
            shuffleArray(sharedCards);
            
            // 重置游戏状态
            player1Numbers = new Array(7).fill(null);
            player2Numbers = new Array(7).fill(null);
            currentCard = null;
            player1Filled = false;
            player2Filled = false;
            gameRound = 0;
            
            // 清空所有槽位
            document.querySelectorAll('.slot').forEach(slot => {
                slot.textContent = '';
                slot.classList.remove('filled', 'winner', 'clickable');
                slot.onclick = null;
            });
            
            // 直接开始第一轮
            drawCard();
        }

        // 打乱数组
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // 抽卡功能
        function drawCard() {
            if (sharedCards.length === 0 || gameRound >= 7) {
                return;
            }
            
            // 抽取第一张卡片
            const drawnNumber = sharedCards.shift();
            currentCard = drawnNumber;
            gameRound++;
            
            // 显示抽到的卡片
            const currentCardElement = document.getElementById('currentCard');
            currentCardElement.textContent = drawnNumber;
            currentCardElement.dataset.number = drawnNumber;
            
            // 重置填入状态
            player1Filled = false;
            player2Filled = false;
            
            // 启用所有空槽位的点击功能
            enableSlotClicking();
            
            document.getElementById('currentCardArea').classList.remove('hidden');
            updateGameStatus();
        }
        
        // 启用槽位点击功能
        function enableSlotClicking() {
            document.querySelectorAll('.slot').forEach(slot => {
                if (!slot.classList.contains('filled')) {
                    slot.classList.add('clickable');
                    slot.onclick = function() {
                        fillSlot(this);
                    };
                }
            });
        }
        
        // 禁用槽位点击功能
        function disableSlotClicking() {
            document.querySelectorAll('.slot').forEach(slot => {
                slot.classList.remove('clickable');
                slot.onclick = null;
            });
        }
        
        // 填入槽位
        function fillSlot(slot) {
            if (currentCard === null) {
                return;
            }
            
            const player = parseInt(slot.dataset.player);
            const position = parseInt(slot.dataset.position);
            
            // 检查该玩家是否已经填入过这张卡片
            if ((player === 1 && player1Filled) || (player === 2 && player2Filled)) {
                return;
            }
            
            // 填入数字
            slot.textContent = currentCard;
            slot.classList.add('filled');
            slot.classList.remove('clickable');
            slot.onclick = null;
            
            // 更新数据
            if (player === 1) {
                player1Numbers[position] = currentCard;
                player1Filled = true;
            } else {
                player2Numbers[position] = currentCard;
                player2Filled = true;
            }
            

            
            // 检查是否两个玩家都已填入
            if (player1Filled && player2Filled) {
                // 隐藏当前卡片
                document.getElementById('currentCardArea').classList.add('hidden');
                currentCard = null;
                
                // 禁用所有槽位点击
                disableSlotClicking();
                
                // 检查游戏是否结束
                if (gameRound >= 7) {
                    setTimeout(() => {
                        showFinalResult();
                    }, 50);
                } else {
                    // 自动抽取下一张卡片
                    setTimeout(() => {
                        drawCard();
                    }, 150);
                }
            }
            
            updateGameStatus();
        }



        // 更新游戏状态显示
        function updateGameStatus() {
            const statusText = document.getElementById('statusText');
            const roundInfo = document.getElementById('roundInfo');
            
            if (currentCard !== null) {
                if (!player1Filled && !player2Filled) {
                    statusText.textContent = `两队同学都可以点击方格填入！`;
                } else if (player1Filled && !player2Filled) {
                    statusText.textContent = `等待蓝队填入数字 ${currentCard}...`;
                } else if (!player1Filled && player2Filled) {
                    statusText.textContent = `等待红队填入数字 ${currentCard}...`;
                } else {
                    statusText.textContent = '准备抽取下一张卡片...';
                }
            } else {
                if (gameRound === 0) {
                    statusText.textContent = '游戏即将开始...';
                } else if (gameRound >= 7) {
                    statusText.textContent = '游戏结束！';
                } else {
                    statusText.textContent = '准备下一轮...';
                }
            }
            
            roundInfo.textContent = `第${gameRound}轮`;
        }

        // 游戏结束处理
        function showFinalResult() {
            // 计算七位数
            const player1Number = parseInt(player1Numbers.join(''));
            const player2Number = parseInt(player2Numbers.join(''));
            
            const statusText = document.getElementById('statusText');
            const roundInfo = document.getElementById('roundInfo');
            const statusArea = document.getElementById('statusArea');
            
            // 显示获胜结果
            if (player1Number > player2Number) {
                statusText.textContent = `🏆 红队获胜！`;
                statusArea.classList.add('red-winner');
            } else if (player2Number > player1Number) {
                statusText.textContent = `🏆 蓝队获胜！`;
                statusArea.classList.add('blue-winner');
            } else {
                statusText.textContent = `🤝 不分上下！`;
                statusArea.classList.add('tie');
            }
            
            roundInfo.textContent = '游戏结束';
        }

        // 页面加载完成后直接初始化游戏
        window.addEventListener('load', () => {
            initGame();
        });
    </script>




<script>
(function () {
  var storageKey = 'edu_hide_brand_panels';
  var toggleButton = document.getElementById('edu-border-toggle');
  if (!toggleButton || !document.body) {
    return;
  }

  function applyState(hidden) {
    document.body.classList.toggle('edu-hide-brand-panels', hidden);
    toggleButton.textContent = hidden ? '+' : '-';
    toggleButton.setAttribute('aria-pressed', hidden ? 'true' : 'false');
    toggleButton.setAttribute('aria-label', hidden ? '显示说明框' : '隐藏说明框');
    toggleButton.setAttribute('title', hidden ? '显示说明框' : '隐藏说明框');
  }

  var hiddenByDefault = false;
  try {
    hiddenByDefault = localStorage.getItem(storageKey) === '1';
  } catch (e) {
    hiddenByDefault = false;
  }

  applyState(hiddenByDefault);

  toggleButton.addEventListener('click', function () {
    var nextHidden = !document.body.classList.contains('edu-hide-brand-panels');
    applyState(nextHidden);
    try {
      localStorage.setItem(storageKey, nextHidden ? '1' : '0');
    } catch (e) {
      // no-op
    }
  });
})();
</script>
