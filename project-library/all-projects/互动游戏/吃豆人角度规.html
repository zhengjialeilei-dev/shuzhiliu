<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔法吃豆人角度乐园 v2.0</title>
    <!-- 引入可爱的字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Zcool+KuaiLe&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color-1: #e0f7fa;
            --bg-color-2: #80deea;
            --panel-bg: #fff9c4;
            --panel-border: #ffb74d;
            --primary-text: #5d4037;
            --acute-color: #76ff03;
            --right-color: #ff1744;
            --obtuse-color: #ff9100;
            --flat-color: #b0bec5;
            --tab-active: #ffca28;
            --tab-inactive: #ffe082;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, var(--bg-color-1), var(--bg-color-2));
            font-family: 'Zcool KuaiLe', 'Fredoka One', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* 动态背景装饰 */
        .bg-shape {
            position: absolute;
            opacity: 0.3;
            animation: float 10s infinite ease-in-out;
            z-index: -1;
        }
        .bg-shape:nth-child(1) { top: 10%; left: 10%; width: 50px; height: 50px; background: #ffcc80; border-radius: 50%; animation-duration: 8s; }
        .bg-shape:nth-child(2) { bottom: 20%; right: 15%; width: 70px; height: 70px; background: #81d4fa; border-radius: 10px; animation-duration: 12s; transform: rotate(45deg); }
        .bg-shape:nth-child(3) { top: 40%; right: 30%; width: 40px; height: 40px; background: #a5d6a7; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); animation-duration: 10s; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        /* 主游戏容器 */
        .game-board {
            position: relative;
            width: 850px;
            max-width: 95%;
            background: var(--panel-bg);
            border: 12px solid var(--panel-border);
            border-radius: 50px;
            padding: 20px 30px;
            box-shadow: 
                0 20px 0 #f57c00,
                0 30px 40px rgba(0,0,0,0.2),
                inset 0 0 50px rgba(255,255,255,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 标题 */
        h1 {
            margin: 0 0 10px 0;
            color: var(--primary-text);
            font-size: 2.2rem;
            text-shadow: 3px 3px 0px #fff;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .title-icon { font-size: 2.5rem; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* 游戏区域 */
        .play-area {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }

        /* 漫画对话气泡 */
        .speech-bubble {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(100px);
            background: #fff;
            padding: 10px 25px;
            border-radius: 30px;
            border: 4px solid #333;
            font-size: 1.8rem;
            color: #333;
            box-shadow: 5px 5px 0 rgba(0,0,0,0.1);
            z-index: 10;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            min-width: 160px;
            text-align: center;
        }
        
        .speech-bubble::after {
            content: ''; position: absolute; bottom: -15px; left: 30px;
            border-width: 15px 15px 0; border-style: solid; border-color: #333 transparent;
        }
        .speech-bubble::before {
            content: ''; position: absolute; bottom: -8px; left: 34px;
            border-width: 12px 12px 0; border-style: solid; border-color: #fff transparent; z-index: 1;
        }

        /* 气泡状态样式 */
        .bubble-acute { border-color: var(--acute-color); color: #33691e; background: #f1f8e9; }
        .bubble-right { border-color: var(--right-color); color: white; background: var(--right-color); animation: pulse-red 0.5s infinite alternate; }
        .bubble-right::before { border-top-color: var(--right-color); }
        .bubble-obtuse { border-color: var(--obtuse-color); color: #bf360c; background: #fff3e0; }
        .bubble-ghost { border-color: #78909c; color: #37474f; background: #eceff1; }

        @keyframes pulse-red {
            from { transform: translateX(100px) scale(1); box-shadow: 0 0 10px var(--right-color); }
            to { transform: translateX(100px) scale(1.1); box-shadow: 0 0 30px var(--right-color); }
        }

        canvas { background: transparent; border-radius: 20px; }
        .fireworks-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

        /* === 选项卡导航 === */
        .tabs-nav {
            display: flex;
            gap: 15px;
            margin-bottom: -20px; /* 下沉效果 */
            z-index: 5;
            width: 90%;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            background: var(--tab-inactive);
            border: none;
            border-radius: 20px 20px 0 0;
            font-family: inherit;
            font-size: 1.4rem;
            color: #795548;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: inset 0 -5px 10px rgba(0,0,0,0.05);
        }

        .tab-btn.active {
            background: #fff; /* 激活时变成白色背景 */
            color: var(--primary-text);
            font-weight: bold;
            transform: translateY(-5px);
            box-shadow: 0 -5px 10px rgba(0,0,0,0.05);
            padding-bottom: 20px;
        }

        /* === 控制面板区域 === */
        .controls-panel {
            width: 100%;
            background: #fff;
            border-radius: 0 0 30px 30px; /* 上方直角，连接Tab */
            padding: 30px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.05);
            min-height: 160px;
        }

        /* 选项卡内容页 */
        .tab-content { display: none; width: 100%; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .control-row { display: flex; align-items: center; gap: 20px; margin-bottom: 15px;}
        .control-label { width: 140px; font-size: 1.3rem; color: var(--primary-text); text-align: right; }
        
        /* 挑战模式特定布局 */
        .challenge-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-top: 10px;
        }

        /* 通用按钮样式 */
        .action-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-family: inherit;
            font-size: 1.5rem;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .action-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
        
        .btn-start { background: #29b6f6; border-bottom: 6px solid #0288d1; }
        .btn-catch { background: #ff7043; border-bottom: 6px solid #d84315; }
        .btn-catch:disabled { background: #bdbdbd; border-bottom: 6px solid #9e9e9e; cursor: not-allowed; }

        /* 滑块容器 */
        .slider-container { flex-grow: 1; position: relative; height: 40px; display: flex; align-items: center; }
        
        /* 轨道样式 */
        .rainbow-track {
            position: absolute; width: 100%; height: 16px; border-radius: 10px; top: 50%; transform: translateY(-50%);
            background: linear-gradient(to right, #ff9a9e, #fad0c4, #fad0c4, #a18cd1, #fbc2eb);
            border: 2px solid #fff; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }
        .blue-track {
            position: absolute; width: 100%; height: 16px; border-radius: 10px; top: 50%; transform: translateY(-50%);
            background: linear-gradient(to right, #89f7fe, #66a6ff);
            border: 2px solid #fff; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }
        .rotate-track {
            position: absolute; width: 100%; height: 16px; border-radius: 10px; top: 50%; transform: translateY(-50%);
            background: linear-gradient(to right, #cfd9df 0%, #e2ebf0 100%);
            border: 2px solid #fff; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }

        /* 原生 Range Input 覆盖 */
        input[type=range] { -webkit-appearance: none; width: 100%; height: 100%; background: transparent; position: relative; z-index: 2; cursor: pointer; margin: 0; }
        input[type=range]:focus { outline: none; }

        /* 滑块按钮 */
        input[type=range].angle-slider::-webkit-slider-thumb {
            -webkit-appearance: none; height: 40px; width: 40px; border-radius: 50%;
            background: radial-gradient(circle, #fff 30%, #ff4081 35%, #ff4081 100%);
            border: 3px solid #fff; box-shadow: 0 4px 8px rgba(0,0,0,0.3); margin-top: -12px; transition: transform 0.1s;
        }
        input[type=range].size-slider::-webkit-slider-thumb {
            -webkit-appearance: none; height: 40px; width: 40px; border-radius: 50%;
            background: #fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%232979ff"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>') no-repeat center center;
            background-size: 24px; border: 3px solid #2979ff; box-shadow: 0 4px 8px rgba(0,0,0,0.3); margin-top: -12px;
        }
        /* 旋转旋钮样式 */
        input[type=range].rotate-slider::-webkit-slider-thumb {
            -webkit-appearance: none; height: 40px; width: 40px; border-radius: 50%;
            background: #fff;
            background-image: repeating-conic-gradient(#fff 0 10deg, #607d8b 10deg 20deg);
            border: 3px solid #607d8b; box-shadow: 0 4px 8px rgba(0,0,0,0.3); margin-top: -12px;
            animation: spin-thumb 5s linear infinite;
        }

        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
        input[type=range]::-webkit-slider-thumb:active { transform: scale(0.9); }

        /* 特效动画 */
        .halo-effect { animation: halo-pulse 0.5s ease-out infinite; }
        @keyframes halo-pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); } 100% { box-shadow: 0 0 0 30px rgba(255, 215, 0, 0); } }

    </style>
</head>
<body>

    <div class="bg-shape"></div><div class="bg-shape"></div><div class="bg-shape"></div>

    <div class="game-board" id="gameBoard">
        <h1><span class="title-icon">🎨</span> 魔法吃豆人角度乐园</h1>

        <div class="play-area">
            <!-- 漫画气泡 -->
            <div id="speechBubble" class="speech-bubble bubble-acute">
                <span id="angleText">45°</span><br>
                <span id="typeText" style="font-size: 1.2rem;">锐角宝宝</span>
            </div>

            <!-- 游戏画布 -->
            <canvas id="gameCanvas" width="600" height="400"></canvas>
            <canvas id="fireworksCanvas" width="600" height="400" class="fireworks-container"></canvas>
        </div>

        <!-- 选项卡导航 -->
        <div class="tabs-nav">
            <button class="tab-btn active" onclick="switchTab('explore')">🎢 自由探索</button>
            <button class="tab-btn" onclick="switchTab('challenge')">👻 幽灵捕手</button>
        </div>

        <div class="controls-panel">
            
            <!-- Tab 1: 自由探索 -->
            <div id="tab-explore" class="tab-content active">
                <div class="control-row">
                    <div class="control-label">😮 嘴巴张多大?</div>
                    <div class="slider-container">
                        <div class="rainbow-track"></div>
                        <input type="range" id="angleSlider" class="angle-slider" min="0" max="180" value="45">
                    </div>
                </div>
                <div class="control-row">
                    <div class="control-label">🔍 身体变多大?</div>
                    <div class="slider-container">
                        <div class="blue-track"></div>
                        <input type="range" id="sizeSlider" class="size-slider" min="80" max="160" value="120">
                    </div>
                </div>
                <!-- 新增：旋转控制 -->
                <div class="control-row">
                    <div class="control-label">🛸 太空旋转</div>
                    <div class="slider-container">
                        <div class="rotate-track"></div>
                        <input type="range" id="rotateSlider" class="rotate-slider" min="0" max="360" value="0">
                    </div>
                </div>
            </div>

            <!-- Tab 2: 幽灵捕手 -->
            <div id="tab-challenge" class="tab-content">
                <div class="control-row">
                    <div class="control-label">😮 调整嘴巴:</div>
                    <div class="slider-container">
                        <div class="rainbow-track"></div>
                        <input type="range" id="challengeSlider" class="angle-slider" min="0" max="180" value="0">
                    </div>
                </div>
                <div class="challenge-controls">
                    <button class="action-btn btn-start" onclick="startChallenge()">👻 召唤新幽灵</button>
                    <button class="action-btn btn-catch" id="catchBtn" onclick="catchGhost()" disabled>🕸️ 捕捉!</button>
                </div>
                <div style="text-align: center; color: #795548; margin-top: 10px; font-size: 1.2rem;">
                    提示：观察灰色的幽灵，把你的吃豆人嘴巴张得和它一样大！
                </div>
            </div>

        </div>
    </div>

    <script>
        // === 游戏配置与状态 ===
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const fwCanvas = document.getElementById('fireworksCanvas');
        const fwCtx = fwCanvas.getContext('2d');
        
        // 控件引用
        const angleSlider = document.getElementById('angleSlider');
        const sizeSlider = document.getElementById('sizeSlider');
        const rotateSlider = document.getElementById('rotateSlider');
        const challengeSlider = document.getElementById('challengeSlider');
        const catchBtn = document.getElementById('catchBtn');
        const speechBubble = document.getElementById('speechBubble');
        const angleText = document.getElementById('angleText');
        const typeText = document.getElementById('typeText');
        const gameBoard = document.getElementById('gameBoard');

        // 核心数据
        let currentMode = 'explore'; // 'explore' | 'challenge'
        let targetAngle = 45; 
        let currentAngle = 45; 
        let radius = 120;
        let globalRotation = 0; // 整体旋转角度 (度)

        // 挑战模式数据
        let ghostAngle = 0;
        let challengeState = 'idle'; // 'idle', 'playing', 'success', 'fail'
        let challengeResultMsg = "";
        
        // 动画控制
        let lastTime = 0;
        let isRightAngleEffectActive = false;
        
        // 豆子系统
        const beans = [];
        for(let i=0; i<8; i++) {
            beans.push({
                baseDist: 60 + i * 35,
                currentDist: 60 + i * 35,
                angleOffset: (Math.random() - 0.5) * 0.15,
                visible: true,
                color: ['#ffcdd2', '#e1bee7', '#c5cae9', '#b2dfdb'][i % 4]
            });
        }
        
        let fireworks = [];

        // === 初始化 ===
        function init() {
            requestAnimationFrame(animate);
        }

        // === Tab 切换逻辑 ===
        window.switchTab = function(mode) {
            currentMode = mode;
            
            // 更新按钮状态
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            // 更新内容显示
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`tab-${mode}`).classList.add('active');

            // 模式切换重置逻辑
            if (mode === 'explore') {
                targetAngle = parseInt(angleSlider.value);
                globalRotation = parseInt(rotateSlider.value);
                speechBubble.style.opacity = 1;
            } else {
                // 挑战模式
                targetAngle = parseInt(challengeSlider.value);
                globalRotation = 0; // 挑战模式默认不旋转，降低难度
                speechBubble.style.opacity = 0; // 隐藏答案气泡
                if (challengeState === 'idle') startChallenge();
            }
        };

        // === 挑战模式逻辑 ===
        window.startChallenge = function() {
            challengeState = 'playing';
            // 生成随机角度 (20 ~ 160)
            ghostAngle = Math.floor(Math.random() * 140) + 20;
            
            // 重置玩家角度
            targetAngle = 0;
            currentAngle = 0;
            challengeSlider.value = 0;
            catchBtn.disabled = false;
            
            // UI 反馈
            speechBubble.style.opacity = 0;
            challengeResultMsg = "";
        };

        window.catchGhost = function() {
            const diff = Math.abs(currentAngle - ghostAngle);
            challengeState = diff < 8 ? 'success' : 'fail'; // 允许8度误差
            
            // 显示气泡结果
            speechBubble.style.opacity = 1;
            
            // 锁定按钮
            catchBtn.disabled = true;

            if (challengeState === 'success') {
                createFireworks(canvas.width/2, canvas.height/2);
            }
        };

        // === 交互监听 ===
        angleSlider.addEventListener('input', (e) => {
            if (currentMode === 'explore') targetAngle = parseInt(e.target.value);
        });

        sizeSlider.addEventListener('input', (e) => {
            if (currentMode === 'explore') radius = parseInt(e.target.value);
        });

        rotateSlider.addEventListener('input', (e) => {
            if (currentMode === 'explore') globalRotation = parseInt(e.target.value);
        });

        challengeSlider.addEventListener('input', (e) => {
            if (currentMode === 'challenge' && challengeState === 'playing') {
                targetAngle = parseInt(e.target.value);
            }
        });

        // === 核心动画循环 ===
        function animate(timestamp) {
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            // 1. 弹性角度物理模拟
            const diff = targetAngle - currentAngle;
            if (Math.abs(diff) > 0.1) {
                currentAngle += diff * 0.15;
            } else {
                currentAngle = targetAngle;
            }

            // 2. 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2 + 40;

            // === 坐标系变换 (实现太空旋转) ===
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(globalRotation * Math.PI / 180);
            ctx.translate(-cx, -cy);

            // 3. 绘制幽灵 (仅在挑战模式)
            if (currentMode === 'challenge') {
                drawGhost(ctx, cx, cy, radius, ghostAngle);
            }

            // 4. 更新与绘制吃豆人
            updateBeans(currentAngle);
            drawBeans(ctx, cx, cy, currentAngle);
            
            // 挑战模式成功时，吃豆人变成开心状态，否则普通绘制
            drawPacMan(ctx, cx, cy, radius, currentAngle, currentMode === 'challenge' && challengeState === 'fail');
            drawAngleMarks(ctx, cx, cy, radius, currentAngle);

            ctx.restore(); // 恢复坐标系，避免影响后续非旋转元素(如果有)

            // 5. 更新UI反馈
            updateUI(currentAngle);

            // 6. 特效渲染 (烟花不需要旋转)
            handleEffects(fwCtx, cx, cy, currentAngle);

            requestAnimationFrame(animate);
        }

        // === 绘图逻辑 ===

        function drawGhost(ctx, cx, cy, r, angleDeg) {
            const rad = angleDeg * Math.PI / 180;
            ctx.save();
            
            // 幽灵身体
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, 0, Math.PI * 2 - rad, false);
            ctx.closePath();
            ctx.fillStyle = 'rgba(120, 144, 156, 0.3)'; // 半透明灰
            ctx.fill();
            
            // 幽灵虚线边框
            ctx.lineWidth = 4;
            ctx.setLineDash([10, 10]);
            ctx.strokeStyle = 'rgba(84, 110, 122, 0.5)';
            ctx.stroke();
            ctx.setLineDash([]);

            // 幽灵眼睛 (呆滞)
            // 如果挑战失败，幽灵做鬼脸
            if (challengeState === 'fail') {
                 // 简单的鬼脸眼
                const eyeX = cx + r * 0.3; const eyeY = cy - r * 0.5;
                ctx.font = "40px Arial";
                ctx.fillStyle = "rgba(84, 110, 122, 0.8)";
                ctx.fillText("😜", eyeX, eyeY);
            }

            ctx.restore();
        }

        function drawPacMan(ctx, cx, cy, r, angleDeg, isSad = false) {
            const rad = angleDeg * Math.PI / 180;
            
            // 身体
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, 0, Math.PI * 2 - rad, false);
            ctx.closePath();
            
            const grd = ctx.createRadialGradient(cx-r/3, cy-r/3, r/5, cx, cy, r);
            grd.addColorStop(0, '#ffff8d');
            grd.addColorStop(1, '#ffeb3b');
            ctx.fillStyle = grd;
            ctx.fill();
            
            ctx.lineWidth = 6;
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#fbc02d';
            ctx.stroke();

            // 眼睛
            const eyeBaseDist = r * 0.5;
            const eyeBaseAngle = -Math.PI / 2 - 0.4;
            const eyeOffset = -(rad * 0.2); 
            const eyeX = cx + eyeBaseDist * Math.cos(eyeBaseAngle + eyeOffset);
            const eyeY = cy + eyeBaseDist * Math.sin(eyeBaseAngle + eyeOffset);
            const eyeSize = r * 0.22;

            if (isSad) {
                // 失败时的晕眩眼
                ctx.beginPath();
                ctx.moveTo(eyeX - 10, eyeY - 10); ctx.lineTo(eyeX + 10, eyeY + 10);
                ctx.moveTo(eyeX + 10, eyeY - 10); ctx.lineTo(eyeX - 10, eyeY + 10);
                ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 4; ctx.stroke();
            } else {
                // 正常/开心眼
                ctx.beginPath();
                ctx.arc(eyeX, eyeY, eyeSize, 0, Math.PI * 2);
                ctx.fillStyle = 'white'; ctx.fill();
                ctx.strokeStyle = '#fbc02d'; ctx.lineWidth = 2; ctx.stroke();

                const pupilDist = eyeSize * 0.3;
                const pupilAngle = -rad / 2;
                const pupilX = eyeX + pupilDist * Math.cos(pupilAngle);
                const pupilY = eyeY + pupilDist * Math.sin(pupilAngle);

                ctx.beginPath();
                ctx.arc(pupilX, pupilY, eyeSize * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = '#3e2723'; ctx.fill();
                
                ctx.beginPath();
                ctx.arc(pupilX - eyeSize*0.1, pupilY - eyeSize*0.1, eyeSize * 0.15, 0, Math.PI * 2);
                ctx.fillStyle = 'white'; ctx.fill();
            }
        }

        function drawBeans(ctx, cx, cy, angleDeg) {
            if (angleDeg < 5) return;
            const rad = angleDeg * Math.PI / 180;
            const mouthCenterAngle = -rad / 2;
            beans.forEach(bean => {
                if (!bean.visible) return;
                const bx = cx + bean.currentDist * Math.cos(mouthCenterAngle + bean.angleOffset);
                const by = cy + bean.currentDist * Math.sin(mouthCenterAngle + bean.angleOffset);
                ctx.beginPath(); ctx.arc(bx, by, 8, 0, Math.PI * 2); ctx.fillStyle = bean.color; ctx.fill();
                ctx.beginPath(); ctx.arc(bx - 2, by - 2, 3, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fill();
            });
        }

        function updateBeans(angleDeg) {
            const eatThreshold = angleDeg * 1.5;
            beans.forEach(bean => {
                if (bean.baseDist < eatThreshold + 50) {
                    bean.currentDist -= 2; 
                    if (bean.currentDist < 20) bean.visible = false;
                } else {
                    if (bean.currentDist < bean.baseDist) {
                        bean.currentDist += 5;
                        bean.visible = true;
                    }
                }
            });
        }

        function drawAngleMarks(ctx, cx, cy, r, angleDeg) {
            ctx.lineCap = 'round'; ctx.lineWidth = 8;
            
            // 固定边
            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + r, cy);
            ctx.strokeStyle = '#76ff03'; ctx.stroke();

            // 活动边
            const rad = angleDeg * Math.PI / 180;
            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + r * Math.cos(-rad), cy + r * Math.sin(-rad));
            ctx.strokeStyle = '#ff9100'; ctx.stroke();

            // 顶点
            ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
            ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke();

            // 直角符号
            if (Math.abs(angleDeg - 90) < 1.5) {
                const size = 25;
                ctx.beginPath(); ctx.lineWidth = 4; ctx.strokeStyle = '#ff1744';
                ctx.moveTo(cx + size, cy); ctx.lineTo(cx + size, cy - size); ctx.lineTo(cx, cy - size);
                ctx.stroke();
                ctx.fillStyle = 'rgba(255, 23, 68, 0.2)'; ctx.fill();
            }
        }

        function updateUI(angleDeg) {
            // 自由探索模式：实时更新
            if (currentMode === 'explore') {
                updateBubbleContent(angleDeg);
            } 
            // 挑战模式：根据状态更新
            else {
                if (challengeState === 'playing') {
                    // 游戏中隐藏数值，只显示状态
                    angleText.innerText = "? °";
                    typeText.innerText = "捕捉幽灵...";
                    speechBubble.className = 'speech-bubble bubble-ghost';
                    gameBoard.classList.remove('halo-effect');
                } else if (challengeState === 'success') {
                    angleText.innerText = Math.round(ghostAngle) + "°";
                    typeText.innerText = "捕捉成功！🎉";
                    speechBubble.className = 'speech-bubble bubble-right';
                } else if (challengeState === 'fail') {
                    angleText.innerText = Math.round(ghostAngle) + "°";
                    typeText.innerText = "差一点点! 👻";
                    speechBubble.className = 'speech-bubble bubble-obtuse';
                }
            }
        }

        function updateBubbleContent(angleDeg) {
            const roundedAngle = Math.round(angleDeg);
            angleText.innerText = roundedAngle + "°";
            
            speechBubble.classList.remove('bubble-acute', 'bubble-right', 'bubble-obtuse', 'bubble-ghost');
            gameBoard.classList.remove('halo-effect');

            if (roundedAngle < 90 && roundedAngle > 0) {
                typeText.innerText = "锐角宝宝";
                speechBubble.classList.add('bubble-acute');
                isRightAngleEffectActive = false;
            } else if (roundedAngle === 90) {
                typeText.innerText = "直角超人!";
                speechBubble.classList.add('bubble-right');
                gameBoard.classList.add('halo-effect');
                if (!isRightAngleEffectActive) {
                    isRightAngleEffectActive = true;
                    createFireworks(canvas.width/2, canvas.height/2 - 50);
                }
            } else if (roundedAngle > 90 && roundedAngle < 180) {
                typeText.innerText = "钝角胖胖";
                speechBubble.classList.add('bubble-obtuse');
                isRightAngleEffectActive = false;
            } else if (roundedAngle === 180) {
                typeText.innerText = "平角爷爷";
                speechBubble.classList.add('bubble-obtuse');
                isRightAngleEffectActive = false;
            } else {
                typeText.innerText = "闭嘴啦";
                speechBubble.classList.add('bubble-acute');
                isRightAngleEffectActive = false;
            }
        }

        function createFireworks(x, y) {
            for (let i = 0; i < 30; i++) {
                fireworks.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`
                });
            }
        }

        function handleEffects(ctx, cx, cy, angleDeg) {
            for (let i = fireworks.length - 1; i >= 0; i--) {
                const p = fireworks[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life -= 0.02;
                if (p.life <= 0) {
                    fireworks.splice(i, 1);
                } else {
                    ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
                    ctx.globalAlpha = 1.0;
                }
            }
        }

        init();

    </script>
</body>
