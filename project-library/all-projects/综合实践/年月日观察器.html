<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年月日观察器</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', -apple-system, sans-serif; background: #e0e5ec; height: 100vh; padding: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; }
        .calendar-container { width: 100%; max-width: 1200px; height: 100vh; display: flex; flex-direction: column; justify-content: center; }
        .year-slider-container { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 800px; display: flex; align-items: center; gap: 20px; background: #e0e5ec; padding: 15px 25px; border-radius: 99px; box-shadow: 9px 9px 16px rgba(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.5), inset 3px 3px 7px rgba(255, 255, 255, 0.7), inset -3px -3px 7px rgba(163,177,198, 0.4);  z-index: 10; }
        .year-slider { flex: 1; height: 8px; background: rgba(59, 130, 246, 0.2); border-radius: 4px; position: relative; cursor: pointer; }
        .year-slider-thumb { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 24px; height: 24px; background: #3b82f6; border: 4px solid white; border-radius: 50%; cursor: grab; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4); transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .year-slider-thumb:hover { transform: translate(-50%, -50%) scale(1.2); }
        .year-slider-thumb:active { cursor: grabbing; transform: translate(-50%, -50%) scale(1.1); }
        .year-display { font-size: 2rem; font-weight: 700; color: #1e293b; min-width: 80px; text-align: center; }
        .year-nav-btn { width: 44px; height: 44px; border: none; background: #e0e5ec; color: #475569; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 5px 5px 10px rgba(163,177,198,0.6), -5px -5px 10px rgba(255,255,255, 0.5), inset 2px 2px 4px rgba(255,255,255,0.8), inset -2px -2px 4px rgba(163,177,198, 0.4); }
        .year-nav-btn:hover { background: #e2e8f0; transform: translateY(-2px); color: #1e293b; box-shadow: 7px 7px 14px rgba(163,177,198,0.6), -7px -7px 14px rgba(255,255,255, 0.5), inset 2px 2px 4px rgba(255,255,255,0.8), inset -2px -2px 4px rgba(163,177,198, 0.4); }
        .year-nav-btn:active { transform: scale(0.95); }
        .calendar-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: 15px; margin-top: 80px; padding: 20px; height: calc(100vh - 120px); overflow-y: auto; }
        .month-card { background: #e0e5ec;  border-radius: 30px; border: 2px solid #ffffff; box-shadow: 9px 9px 16px rgba(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.5), inset 3px 3px 7px rgba(255, 255, 255, 0.7), inset -3px -3px 7px rgba(163,177,198, 0.4); display: flex; flex-direction: column; overflow: hidden; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); cursor: pointer; }
        .month-card:hover { transform: translateY(-5px); box-shadow: 0 20px 35px -5px rgba(0, 0, 0, 0.1); background: #e0e5ec; }
        .month-header { padding: 10px; text-align: center; background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(37, 99, 235, 0.1) 100%); border-bottom: 1px solid rgba(255,255,255,0.5); }

        .single-month-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }

        @media (max-width: 1024px) {

<body class="edu-refactor-body">
<!-- EDU_BRAND_SHELL_START -->
<div class="edu-brand-shell" data-brand-shell>
  <section class="edu-brand-panel" aria-label="页面导语">
    <div class="edu-brand-kicker">时间认知 · EDU STUDIO</div>
    <h1 class="edu-brand-title">年月日观察器</h1>
    <div class="edu-brand-copy">
      <div><strong>任务目标：</strong>在年视图与月视图之间切换，理解日期结构和周期。</div>
      <div><strong>操作提示：</strong>切换年份、月份与视图模式，查看日期如何排布。</div>
      <div><strong>理解重点：</strong>日历本质上是固定规则的周期系统，关键是抓住年、月、周之间的关系。</div>
    </div>
</section>
  <aside class="edu-brand-guide" aria-label="操作建议">
    <h2>建议这样探索</h2>
    <ul><li>先看同一年里各月天数差异。</li><li>再比较不同年份的变化。</li><li>留意周起点如何影响排布。</li></ul>
  </aside>
</div>
<!-- EDU_BRAND_SHELL_END -->

<button type="button" class="edu-border-toggle" id="edu-border-toggle" aria-pressed="false" aria-label="隐藏说明框" title="隐藏说明框">-</button>

    <div class="calendar-container">
        <div class="year-slider-container">
            <div class="year-display" id="yearDisplay">2025</div>
            <div class="year-slider" id="yearSlider">
                <div class="year-slider-thumb" id="yearThumb"></div>
            </div>
            <button class="year-nav-btn" id="prevYear">‹</button>
            <button class="year-nav-btn" id="nextYear">›</button>
        </div>

        <div class="calendar-grid" id="calendarGrid">
            <!-- 月历将通过JavaScript生成 -->
        </div>

        <!-- 单月日历视图 -->
        <div class="single-month-view" id="singleMonthView">
            <div class="single-month-header">
                <button class="back-button" id="backToYear">← 返回年历</button>
                <div class="single-month-title" id="singleMonthTitle">2025年1月</div>
                <div class="single-month-nav">
                    <button class="month-nav-btn" id="prevMonth">‹</button>
                    <button class="month-nav-btn" id="nextMonth">›</button>
                </div>
            </div>
            <div class="single-month-calendar">
                <div class="single-month-weekdays" id="singleMonthWeekdays">
                    <!-- 星期标题将通过JavaScript生成 -->
                </div>
                <div class="single-month-days" id="singleMonthDays">
                    <!-- 日期将通过JavaScript生成 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const monthNames = [
            '1<br>月', '2<br>月', '3<br>月', '4<br>月', '5<br>月', '6<br>月',
            '7<br>月', '8<br>月', '9<br>月', '10<br>月', '11<br>月', '12<br>月'
        ];

        const weekdayNames = ['日', '一', '二', '三', '四', '五', '六'];
        
        let currentYear = 2025;
        let currentMonth = 1;
        let currentView = 'year'; // 'year' 或 'month'
        const minYear = 1900;
        const maxYear = 2100;
        let isDragging = false;

        function getDaysInMonth(year, month) {
            return new Date(year, month, 0).getDate();
        }

        function getFirstDayOfMonth(year, month) {
            return new Date(year, month - 1, 1).getDay();
        }

        function createMonthCalendar(year, month) {
            const monthCard = document.createElement('div');
            monthCard.className = 'month-card';

            const monthHeader = document.createElement('div');
            monthHeader.className = 'month-header';
            monthHeader.addEventListener('click', () => {
                showSingleMonth(year, month);
            });

            const monthName = document.createElement('div');
            monthName.className = 'month-name';
            monthName.innerHTML = monthNames[month - 1];

            monthHeader.appendChild(monthName);

            const calendarContent = document.createElement('div');
            calendarContent.className = 'calendar-content';

            const weekdays = document.createElement('div');
            weekdays.className = 'weekdays';

            weekdayNames.forEach(day => {
                const weekday = document.createElement('div');
                weekday.className = 'weekday';
                weekday.textContent = day;
                weekdays.appendChild(weekday);
            });

            const days = document.createElement('div');
            days.className = 'days';

            const daysInMonth = getDaysInMonth(year, month);
            const firstDay = getFirstDayOfMonth(year, month);

            const today = new Date();
            const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month - 1;
            const todayDate = today.getDate();

            // 添加空白单元格以对齐第一天
            for (let i = 0; i < firstDay; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'day';
                days.appendChild(emptyDay);
            }

            // 添加当前月的日期
            for (let date = 1; date <= daysInMonth; date++) {
                const day = document.createElement('div');
                day.className = 'day';
                
                const dayOfWeek = (firstDay + date - 1) % 7;
                if (dayOfWeek === 0 || dayOfWeek === 6) {
                    day.classList.add('weekend');
                }

                if (isCurrentMonth && date === todayDate) {
                    day.classList.add('today');
                }

                day.textContent = date;
                days.appendChild(day);
            }

            calendarContent.appendChild(weekdays);
            calendarContent.appendChild(days);

            monthCard.appendChild(monthHeader);
            monthCard.appendChild(calendarContent);

            return monthCard;
        }

        function generateCalendar(year = currentYear) {
            const calendarGrid = document.getElementById('calendarGrid');
            calendarGrid.innerHTML = ''; // 清空现有内容

            for (let month = 1; month <= 12; month++) {
                const monthCalendar = createMonthCalendar(year, month);
                calendarGrid.appendChild(monthCalendar);
            }
        }

        function updateYear(year) {
            // 限制年份范围
            year = Math.max(minYear, Math.min(maxYear, year));
            currentYear = year;
            
            // 更新显示
            document.getElementById('yearDisplay').textContent = year;
            document.title = `${year}年月历`;
            
            // 更新滑块位置
            updateSliderPosition();
            
            // 重新生成日历
            generateCalendar(year);
            
            // 如果当前在单月视图，同步更新单月日历
            if (currentView === 'month') {
                updateSingleMonthView();
            }
        }

        // 显示单月日历
        function showSingleMonth(year, month) {
            currentYear = year;
            currentMonth = month;
            currentView = 'month';
            
            // 隐藏年历网格
            document.getElementById('calendarGrid').style.display = 'none';
            
            // 显示单月视图
            document.getElementById('singleMonthView').style.display = 'block';
            
            // 更新单月日历内容
            updateSingleMonthView();
        }

        // 显示年历视图
        function showYearView() {
            currentView = 'year';
            
            // 显示年历网格
            document.getElementById('calendarGrid').style.display = 'grid';
            
            // 隐藏单月视图
            document.getElementById('singleMonthView').style.display = 'none';
        }

        // 更新单月日历视图
        function updateSingleMonthView() {
            // 更新标题
            document.getElementById('singleMonthTitle').textContent = `${currentYear}年${currentMonth}月`;
            
            // 生成星期标题
            const weekdaysContainer = document.getElementById('singleMonthWeekdays');
            weekdaysContainer.innerHTML = '';
            weekdayNames.forEach(day => {
                const weekday = document.createElement('div');
                weekday.className = 'single-month-weekday';
                weekday.textContent = day;
                weekdaysContainer.appendChild(weekday);
            });
            
            // 生成日期
            const daysContainer = document.getElementById('singleMonthDays');
            daysContainer.innerHTML = '';
            
            const daysInMonth = getDaysInMonth(currentYear, currentMonth);
            const firstDay = getFirstDayOfMonth(currentYear, currentMonth);
            
            const today = new Date();
            const isCurrentMonth = today.getFullYear() === currentYear && today.getMonth() === currentMonth - 1;
            const todayDate = today.getDate();            
            // 添加空白单元格（对应上个月的位置）
            for (let i = 0; i < firstDay; i++) {
                const day = document.createElement('div');
                day.className = 'single-month-day';
                daysContainer.appendChild(day);
            }
            
            // 添加当前月的日期
            for (let date = 1; date <= daysInMonth; date++) {
                const day = document.createElement('div');
                day.className = 'single-month-day';
                
                const dayOfWeek = (firstDay + date - 1) % 7;
                if (dayOfWeek === 0 || dayOfWeek === 6) {
                    day.classList.add('weekend');
                }
                
                if (isCurrentMonth && date === todayDate) {
                    day.classList.add('today');
                }
                
                day.textContent = date;
                daysContainer.appendChild(day);
            }
        }

        // 切换到上一个月
        function goToPrevMonth() {
            if (currentMonth === 1) {
                currentMonth = 12;
                currentYear--;
            } else {
                currentMonth--;
            }
            updateSingleMonthView();
        }

        // 切换到下一个月
        function goToNextMonth() {
            if (currentMonth === 12) {
                currentMonth = 1;
                currentYear++;
            } else {
                currentMonth++;
            }
            updateSingleMonthView();
        }

        function updateSliderPosition() {
            const slider = document.getElementById('yearSlider');
            const thumb = document.getElementById('yearThumb');
            const progress = (currentYear - minYear) / (maxYear - minYear);
            const thumbPosition = progress * slider.offsetWidth;
            thumb.style.left = `${thumbPosition}px`;
        }

        function getYearFromPosition(x) {
            const slider = document.getElementById('yearSlider');
            const rect = slider.getBoundingClientRect();
            const progress = Math.max(0, Math.min(1, (x - rect.left) / rect.width));
            return Math.round(minYear + progress * (maxYear - minYear));
        }

        function initializeSlider() {
            const slider = document.getElementById('yearSlider');
            const thumb = document.getElementById('yearThumb');
            const prevBtn = document.getElementById('prevYear');
            const nextBtn = document.getElementById('nextYear');

            // 初始化滑块位置
            updateSliderPosition();

            // 拖动功能
            function startDrag(e) {
                isDragging = true;
                e.preventDefault();
                document.addEventListener('mousemove', drag);
                document.addEventListener('mouseup', stopDrag);
                document.addEventListener('touchmove', drag, { passive: false });
                document.addEventListener('touchend', stopDrag);
            }

            function drag(e) {
                if (!isDragging) return;
                e.preventDefault();
                
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const year = getYearFromPosition(clientX);
                updateYear(year);
            }

            function stopDrag() {
                isDragging = false;
                document.removeEventListener('mousemove', drag);
                document.removeEventListener('mouseup', stopDrag);
                document.removeEventListener('touchmove', drag, { passive: false });
                document.removeEventListener('touchend', stopDrag);
            }

            // 滑块拖动事件
            thumb.addEventListener('mousedown', startDrag);
            thumb.addEventListener('touchstart', startDrag, { passive: false });

            // 点击滑动条直接跳转
            slider.addEventListener('click', (e) => {
                if (e.target === thumb) return;
                const year = getYearFromPosition(e.clientX);
                updateYear(year);
            });

            // 左右按钮
            prevBtn.addEventListener('click', () => {
                updateYear(currentYear - 1);
            });

            nextBtn.addEventListener('click', () => {
                updateYear(currentYear + 1);
            });

            // 键盘支持
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    updateYear(currentYear - 1);
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    updateYear(currentYear + 1);
                }
            });

            // 鼠标滚轮支持
            slider.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 1 : -1;
                updateYear(currentYear + delta);
            }, { passive: false });
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            generateCalendar();
            initializeSlider();
            initializeSingleMonthView();
        });

        // 初始化单月视图事件监听器
        function initializeSingleMonthView() {
            // 返回年历按钮
            document.getElementById('backToYear').addEventListener('click', showYearView);
            
            // 上一个月按钮
            document.getElementById('prevMonth').addEventListener('click', goToPrevMonth);
            
            // 下一个月按钮
            document.getElementById('nextMonth').addEventListener('click', goToNextMonth);
        }
    </script>




<script>
(function () {
  var storageKey = 'edu_hide_brand_panels';
  var toggleButton = document.getElementById('edu-border-toggle');
  if (!toggleButton || !document.body) {
    return;
  }

  function applyState(hidden) {
    document.body.classList.toggle('edu-hide-brand-panels', hidden);
    toggleButton.textContent = hidden ? '+' : '-';
    toggleButton.setAttribute('aria-pressed', hidden ? 'true' : 'false');
    toggleButton.setAttribute('aria-label', hidden ? '显示说明框' : '隐藏说明框');
    toggleButton.setAttribute('title', hidden ? '显示说明框' : '隐藏说明框');
  }

  var hiddenByDefault = false;
  try {
    hiddenByDefault = localStorage.getItem(storageKey) === '1';
  } catch (e) {
    hiddenByDefault = false;
  }

  applyState(hiddenByDefault);

  toggleButton.addEventListener('click', function () {
    var nextHidden = !document.body.classList.contains('edu-hide-brand-panels');
    applyState(nextHidden);
    try {
      localStorage.setItem(storageKey, nextHidden ? '1' : '0');
    } catch (e) {
      // no-op
    }
  });
})();
</script>
