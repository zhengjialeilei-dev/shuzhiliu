name: Deploy MathFlow To Tencent Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-web-main
  cancel-in-progress: false

jobs:
  teaching-projects:
    uses: ./.github/workflows/teaching-projects.yml
  deploy-web:
    needs: teaching-projects
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres-test:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mathflow_release_test
          POSTGRES_USER: release_test
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U release_test -d mathflow_release_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/apps/web/public/files/
            !/project-library/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Verify Project
        env:
          REVISION_TEST_DATABASE_URL: postgresql://release_test:isolated-ci-only@127.0.0.1:5432/mathflow_release_test
        run: |
          npm run lint
          npm test
          npm run test:revisions
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Deploy through Tencent TAT
        env:
          Tencent_SecretId: ${{ secrets.TENCENT_SECRET_ID }}
          Tencent_SecretKey: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          ARCHIVE_TAR="$RUNNER_TEMP/mathflow-$GITHUB_SHA.tar"
          ARCHIVE_FILE="$ARCHIVE_TAR.gz"
          echo "Creating the minimal production deployment archive..."
          tar --create --file="$ARCHIVE_TAR" \
            .dockerignore package.json package-lock.json \
            apps/api/Dockerfile apps/api/package.json apps/api/src apps/api/seed \
            deploy/docker-compose.yml deploy/run_migrations.sh deploy/web_release.sh deploy/db deploy/check_release.mjs
          tar --append --file="$ARCHIVE_TAR" \
            --exclude='apps/web/dist/files' apps/web/dist
          gzip "$ARCHIVE_TAR"
          du -h "$ARCHIVE_FILE"

          {
            printf "ENV_FILE='%s'\n" "/opt/1panel/apps/mathflow-sparkaiedu/shuzhiliu/deploy/.env"
            printf "OBJECT_KEY='%s'\n" "deployments/github/$GITHUB_SHA.tar.gz"
            cat <<'SCRIPT'
          set -euo pipefail
          test -f "$ENV_FILE"
          python3 - "$ENV_FILE" "$OBJECT_KEY" <<'PYTHON'
          SCRIPT
            cat .github/scripts/presign_cos_transfer.py
            cat <<'SCRIPT'
          PYTHON
          SCRIPT
          } > "$RUNNER_TEMP/prepare-transfer.sh"

          TRANSFER_OUTPUT=$(python .github/scripts/run_tat_command.py \
            --command-file "$RUNNER_TEMP/prepare-transfer.sh" \
            --name prepare-mathflow-transfer \
            --description "Prepare MathFlow transfer for $GITHUB_SHA" \
            --timeout 120)
          PUT_URL=$(printf '%s\n' "$TRANSFER_OUTPUT" | sed -n 's/^PUT_URL=//p')
          GET_URL=$(printf '%s\n' "$TRANSFER_OUTPUT" | sed -n 's/^GET_URL=//p')
          DELETE_URL=$(printf '%s\n' "$TRANSFER_OUTPUT" | sed -n 's/^DELETE_URL=//p')
          test -n "$PUT_URL" && test -n "$GET_URL" && test -n "$DELETE_URL"
          echo "::add-mask::$PUT_URL"
          echo "::add-mask::$GET_URL"
          echo "::add-mask::$DELETE_URL"
          echo "Uploading deployment archive to Tencent COS..."
          curl --fail --silent --show-error --request PUT --upload-file "$ARCHIVE_FILE" "$PUT_URL"

          {
            printf "DEPLOY_SHA='%s'\n" "$GITHUB_SHA"
            printf "SOURCE_ARCHIVE='%s'\n" "$GET_URL"
            printf "DELETE_URL='%s'\n" "$DELETE_URL"
            cat <<'SCRIPT'
          set -euo pipefail

          # A cancelled Actions runner cannot stop an already dispatched TAT command.
          # Serialize deployments on the server so overlapping runs cannot replace each other.
          exec 9>/tmp/mathflow-deploy.lock
          flock --wait 1800 9

          SOURCE_ROOT=/opt/1panel/apps/mathflow-sparkaiedu/github-deploy
          NEXT_SOURCE_ROOT=/opt/1panel/apps/mathflow-sparkaiedu/github-deploy.next
          PREVIOUS_SOURCE_ROOT=/opt/1panel/apps/mathflow-sparkaiedu/github-deploy.previous
          LEGACY_ROOT=/opt/1panel/apps/mathflow-sparkaiedu/shuzhiliu
          ENV_FILE="$LEGACY_ROOT/deploy/.env"
          SITE_ROOT=/opt/1panel/www/sites/sparkaiedu.com/index
          STAGING_DIR=$(mktemp -d /tmp/mathflow-web.XXXXXX)
          ARCHIVE_FILE=$(mktemp /tmp/mathflow-source.XXXXXX.tar.gz)
          BACKUP_DIR="$LEGACY_ROOT/deploy/backups"
          install -d -m 700 "$BACKUP_DIR"
          RELEASE_BACKUP=$(mktemp -d "$BACKUP_DIR/release-$DEPLOY_SHA.XXXXXX")
          WEB_ACTIVATION_STARTED=false
          API_SWITCH_STARTED=false
          PREVIOUS_API_IMAGE=$(docker inspect --format '{{.Image}}' mathflow-api)
          ROLLBACK_IMAGE="mathflow-api-rollback:$(basename "$RELEASE_BACKUP")"
          docker image tag "$PREVIOUS_API_IMAGE" "$ROLLBACK_IMAGE"
          printf 'services:\n  api:\n    image: "%s"\n' "$ROLLBACK_IMAGE" > "$RELEASE_BACKUP/api-rollback.yml"
          printf '%s\n' "$PREVIOUS_API_IMAGE" > "$RELEASE_BACKUP/api-image-id"

          recover_release() {
            local status=$?
            trap - ERR
            set +e
            if [ "$WEB_ACTIVATION_STARTED" = true ]; then
              rollback_web_release "$SITE_ROOT" "$RELEASE_BACKUP/web" \
                || echo 'ERROR: could not restore previous website entry' >&2
            fi
            if [ "$API_SWITCH_STARTED" = true ]; then
              if docker compose \
                --project-directory "$SOURCE_ROOT/deploy" \
                --env-file "$ENV_FILE" \
                -f "$SOURCE_ROOT/deploy/docker-compose.yml" \
                -f "$RELEASE_BACKUP/api-rollback.yml" \
                up -d --no-build --pull never api; then
                curl --fail --silent --show-error --max-time 5 \
                  --retry 10 --retry-delay 2 --retry-all-errors \
                  http://127.0.0.1:3001/api/health >/dev/null \
                  || echo 'ERROR: previous API image restarted but health check failed' >&2
              else
                echo 'ERROR: could not restart previous API image' >&2
              fi
            fi
            echo "Release failed. Recovery files: $RELEASE_BACKUP. Database is NOT automatically restored." >&2
            exit "$status"
          }
          set -E
          trap recover_release ERR

          cleanup() {
            rm -rf "$STAGING_DIR" "$NEXT_SOURCE_ROOT"
            rm -f "$ARCHIVE_FILE"
            curl --fail --silent --show-error --request DELETE "$DELETE_URL" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Stop an older server-side web image build that outlived a cancelled workflow.
          pkill -f '^docker build --pull -t mathflow-web-deploy:' >/dev/null 2>&1 || true
          sleep 2

          test -f "$ENV_FILE"
          install -d -m 755 "$NEXT_SOURCE_ROOT" "$SITE_ROOT"
          curl --fail --location --silent --show-error \
            --connect-timeout 20 --max-time 1200 --retry 3 --retry-all-errors \
            "$SOURCE_ARCHIVE" -o "$ARCHIVE_FILE"
          tar -xzf "$ARCHIVE_FILE" -C "$NEXT_SOURCE_ROOT"
          test -f "$NEXT_SOURCE_ROOT/package.json"
          test -f "$NEXT_SOURCE_ROOT/apps/api/package.json"
          test -f "$SITE_ROOT/files/textbooks/rj-math-grade-1-volume-1-2024-fall.pdf"

          rm -rf "$PREVIOUS_SOURCE_ROOT"
          if [ -d "$SOURCE_ROOT" ]; then mv "$SOURCE_ROOT" "$PREVIOUS_SOURCE_ROOT"; fi
          mv "$NEXT_SOURCE_ROOT" "$SOURCE_ROOT"

          cp -a "$SOURCE_ROOT/apps/web/dist/." "$STAGING_DIR/"
          test -f "$STAGING_DIR/index.html"
          source "$SOURCE_ROOT/deploy/web_release.sh"
          docker exec mathflow-postgres sh -c \
            'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' \
            > "$RELEASE_BACKUP/database.dump"
          test -s "$RELEASE_BACKUP/database.dump"
          # Build before migrations/switching so a failed build keeps serving
          # the existing application. Migrations must be backward compatible.
          docker compose \
            --project-directory "$SOURCE_ROOT/deploy" \
            --env-file "$ENV_FILE" \
            -f "$SOURCE_ROOT/deploy/docker-compose.yml" build api
          POSTGRES_CONTAINER=mathflow-postgres sh "$SOURCE_ROOT/deploy/run_migrations.sh" \
            "$SOURCE_ROOT/deploy/db/migrations"

          API_SWITCH_STARTED=true
          docker compose \
            --project-directory "$SOURCE_ROOT/deploy" \
            --env-file "$ENV_FILE" \
            -f "$SOURCE_ROOT/deploy/docker-compose.yml" \
            up -d --no-build api

          API_READY=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --max-time 5 http://127.0.0.1:3001/api/health >/dev/null; then
              API_READY=true
              break
            fi
            sleep 2
          done
          test "$API_READY" = true

          # HTTP 200 alone does not prove the database/storage or new catalog
          # endpoints work. Fail here before activating the new frontend.
          docker exec -i -e RELEASE_BASE_URL=http://127.0.0.1:3001 \
            mathflow-api node --input-type=module < "$SOURCE_ROOT/deploy/check_release.mjs"

          prepare_web_release "$STAGING_DIR" "$SITE_ROOT" "$RELEASE_BACKUP/web"
          WEB_ACTIVATION_STARTED=true
          activate_web_release "$SITE_ROOT" "$RELEASE_BACKUP/web"

          docker exec 1Panel-openresty-z1xG openresty -s reload \
            || docker exec 1Panel-openresty-z1xG nginx -s reload

          curl --http1.1 --fail --silent --show-error --head --max-time 30 \
            --retry 5 --retry-delay 2 --retry-all-errors https://sparkaiedu.com/
          curl --http1.1 --fail --silent --show-error --max-time 30 \
            --retry 5 --retry-delay 2 --retry-all-errors https://sparkaiedu.com/api/health
          EXPECTED_INDEX_SHA256=$(sha256sum "$STAGING_DIR/index.html" | cut -d ' ' -f 1)
          docker exec -i -e RELEASE_BASE_URL=https://sparkaiedu.com \
            -e RELEASE_CHECK_WEB=true -e RELEASE_EXPECTED_INDEX_SHA256="$EXPECTED_INDEX_SHA256" \
            mathflow-api node --input-type=module < "$SOURCE_ROOT/deploy/check_release.mjs"
          # Keep recovery metadata and old hashed assets. Retention/GC must be
          # a separate operation, never part of the live release transaction.
          trap - ERR
          echo "Release ready. Recovery files: $RELEASE_BACKUP"
          SCRIPT
          } > "$RUNNER_TEMP/deploy.sh"

          echo "Dispatching production deployment through Tencent TAT..."
          python .github/scripts/run_tat_command.py \
            --command-file "$RUNNER_TEMP/deploy.sh" \
            --name deploy-mathflow-web \
            --description "Deploy MathFlow commit $GITHUB_SHA" \
            --timeout 1800
