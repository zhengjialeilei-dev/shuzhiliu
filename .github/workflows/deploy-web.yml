name: Deploy Web To Tencent Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-web-main
  cancel-in-progress: true

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: npm ci

      - name: Install Deploy Dependencies
        run: python -m pip install --upgrade pip paramiko

      - name: Deploy To Server
        env:
          MATHFLOW_DEPLOY_HOST: ${{ secrets.MATHFLOW_DEPLOY_HOST }}
          MATHFLOW_DEPLOY_USER: ${{ secrets.MATHFLOW_DEPLOY_USER }}
          MATHFLOW_DEPLOY_PASSWORD: ${{ secrets.MATHFLOW_DEPLOY_PASSWORD }}
          MATHFLOW_SITE_URL: ${{ secrets.MATHFLOW_SITE_URL }}
          MATHFLOW_REMOTE_REPO_ROOT: ${{ secrets.MATHFLOW_REMOTE_REPO_ROOT }}
          MATHFLOW_REMOTE_SITE_ROOT: ${{ secrets.MATHFLOW_REMOTE_SITE_ROOT }}
          MATHFLOW_OPENRESTY_CONTAINER: ${{ secrets.MATHFLOW_OPENRESTY_CONTAINER }}
          MATHFLOW_POSTGRES_CONTAINER: ${{ secrets.MATHFLOW_POSTGRES_CONTAINER }}
        run: npm run deploy:web
