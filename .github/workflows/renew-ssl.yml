name: Renew sparkaiedu.com SSL

on:
  schedule:
    # Run at 02:17 China Standard Time on the 1st and 15th of each month.
    - cron: "17 18 1,15 * *"
  workflow_dispatch:

concurrency:
  group: renew-sparkaiedu-ssl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renew-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      Tencent_SecretId: ${{ secrets.TENCENT_SECRET_ID }}
      Tencent_SecretKey: ${{ secrets.TENCENT_SECRET_KEY }}

    steps:
      - name: Install acme.sh
        run: |
          git clone --branch 3.1.2 --depth 1 https://github.com/acmesh-official/acme.sh.git "$RUNNER_TEMP/acme.sh"
          cd "$RUNNER_TEMP/acme.sh"
          ./acme.sh --install --home "$RUNNER_TEMP/acme-home" --nocron

      - name: Issue certificate with Tencent DNS
        run: |
          "$RUNNER_TEMP/acme-home/acme.sh" --issue \
            --server letsencrypt \
            --dns dns_tencent \
            --dnssleep 660 \
            --keylength ec-256 \
            --force \
            -d sparkaiedu.com \
            -d www.sparkaiedu.com

      - name: Install certificate through Tencent TAT
        run: |
          export CERT_DIR="$HOME/.acme.sh/sparkaiedu.com_ecc"
          python3 <<'PY'
          import base64
          import datetime
          import hashlib
          import hmac
          import json
          import os
          import time
          import urllib.request

          secret_id = os.environ["Tencent_SecretId"]
          secret_key = os.environ["Tencent_SecretKey"]
          cert_dir = os.environ["CERT_DIR"]

          def encoded_file(name):
              with open(os.path.join(cert_dir, name), "rb") as handle:
                  return base64.b64encode(handle.read()).decode("ascii")

          certificate = encoded_file("fullchain.cer")
          private_key = encoded_file("sparkaiedu.com.key")
          command = f"""set -euo pipefail
          install -d -m 700 -o certdeploy -g certdeploy /home/certdeploy/incoming
          printf '%s' '{certificate}' | base64 -d > /home/certdeploy/incoming/fullchain.pem
          printf '%s' '{private_key}' | base64 -d > /home/certdeploy/incoming/privkey.pem
          chown certdeploy:certdeploy /home/certdeploy/incoming/fullchain.pem /home/certdeploy/incoming/privkey.pem
          chmod 600 /home/certdeploy/incoming/fullchain.pem /home/certdeploy/incoming/privkey.pem
          /usr/local/sbin/install-sparkaiedu-cert
          """

          payload = json.dumps({
              "CommandName": "renew-sparkaiedu-ssl",
              "SaveCommand": False,
              "Description": "Install validated sparkaiedu.com certificate",
              "Content": base64.b64encode(command.encode("utf-8")).decode("ascii"),
              "CommandType": "SHELL",
              "WorkingDirectory": "/root",
              "Timeout": 120,
              "InstanceIds": ["lhins-e1irqmx9"],
          }, separators=(",", ":"))

          service = "tat"
          host = "tat.tencentcloudapi.com"
          action = "RunCommand"
          version = "2020-10-28"
          region = "ap-guangzhou"
          timestamp = int(time.time())
          date = datetime.datetime.fromtimestamp(timestamp, datetime.timezone.utc).strftime("%Y-%m-%d")
          canonical_headers = f"content-type:application/json; charset=utf-8\nhost:{host}\n"
          signed_headers = "content-type;host"
          hashed_payload = hashlib.sha256(payload.encode("utf-8")).hexdigest()
          canonical_request = "\n".join([
              "POST", "/", "", canonical_headers, signed_headers, hashed_payload
          ])
          credential_scope = f"{date}/{service}/tc3_request"
          string_to_sign = "\n".join([
              "TC3-HMAC-SHA256",
              str(timestamp),
              credential_scope,
              hashlib.sha256(canonical_request.encode("utf-8")).hexdigest(),
          ])

          def sign(key, message):
              return hmac.new(key, message.encode("utf-8"), hashlib.sha256).digest()

          secret_date = sign(("TC3" + secret_key).encode("utf-8"), date)
          secret_service = sign(secret_date, service)
          secret_signing = sign(secret_service, "tc3_request")
          signature = hmac.new(
              secret_signing, string_to_sign.encode("utf-8"), hashlib.sha256
          ).hexdigest()
          authorization = (
              f"TC3-HMAC-SHA256 Credential={secret_id}/{credential_scope}, "
              f"SignedHeaders={signed_headers}, Signature={signature}"
          )

          request = urllib.request.Request(
              f"https://{host}",
              data=payload.encode("utf-8"),
              headers={
                  "Authorization": authorization,
                  "Content-Type": "application/json; charset=utf-8",
                  "Host": host,
                  "X-TC-Action": action,
                  "X-TC-Timestamp": str(timestamp),
                  "X-TC-Version": version,
                  "X-TC-Region": region,
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)["Response"]
          if "Error" in result:
              raise SystemExit(f"Tencent TAT failed: {result['Error']['Code']}")
          print(f"Tencent TAT invocation started: {result['InvocationId']}")
          PY

      - name: Verify deployed HTTPS certificate
        run: |
          CERT_DIR="$HOME/.acme.sh/sparkaiedu.com_ecc"
          EXPECTED=$(openssl x509 -in "$CERT_DIR/fullchain.cer" -noout -fingerprint -sha256)

          for attempt in {1..18}; do
            ACTUAL=$(echo | openssl s_client -connect sparkaiedu.com:443 -servername sparkaiedu.com 2>/dev/null \
              | openssl x509 -noout -fingerprint -sha256 2>/dev/null || true)
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              echo "The renewed certificate is live."
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "The public certificate did not update in time." >&2
              exit 1
            fi
            sleep 5
          done

          curl --fail --silent --show-error --head --max-time 20 https://sparkaiedu.com/
          echo | openssl s_client -connect sparkaiedu.com:443 -servername sparkaiedu.com 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates -ext subjectAltName
