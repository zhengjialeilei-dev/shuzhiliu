    <h1 class="edu-brand-title">旋转寻迹实验台</h1>
    <div class="edu-brand-copy">
      <div><strong>任务目标：</strong>观察图形绕定点旋转后的轨迹变化，并记录区域覆盖结果。</div>
      <div><strong>操作提示：</strong>拖动旋转臂或调整角度，对照不同位置下的覆盖情况。</div>
      <div><strong>理解重点：</strong>旋转会改变方向，但图形上各点到旋转中心的距离保持不变。</div>
    </div>
</section>
  <aside class="edu-brand-guide" aria-label="操作建议">
    <h2>建议这样探索</h2>
    <ul><li>先找旋转中心。</li><li>再看顶点走过的路径。</li><li>比较旋转前后重合的区域。</li></ul>

<div class="header">
    <h1>🔦 深海灯塔探宝</h1>
    <p>拖动旋转臂绕中心点 C 转动，追踪覆盖区域，并定位隐藏目标。</p>
</div>

<div class="hint" id="hint">拖动左侧旋转臂（三角形）绕点 C 转动</div>

<div class="progress-box">
    <div class="progress-title">覆盖进度 (<span id="area-percent">0</span>%)</div>
    <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="treasures-found">已定位目标: <span id="treasure-count">0</span> / 5</div>
</div>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const hint = document.getElementById('hint');
    const progressBar = document.getElementById('progress-bar');
    const areaPercent = document.getElementById('area-percent');
    const treasureCountEl = document.getElementById('treasure-count');

    // --- 几何参数 ---
    let cx, cy; // 圆心 C (灯塔)
    let sideLength; // 边长
    let rotationAngle = 0; // 当前旋转角度 (0 ~ 120度)
    const MAX_ROTATION = (2 * Math.PI) / 3; // 120度
    
    // --- 交互状态 ---
    let isDragging = false;
    let startDragAngle = 0;
    let startRotation = 0;
    let maxReachedAngle = 0; // 记录扫过的最大角度

    // --- 宝藏数据 ---
    // 在角度 0 ~ 120 度之间的不同位置分布宝藏
    let treasures = [
        { emoji: '💎', rRatio: 0.8, angleOffset: 0.2, found: false },
        { emoji: '🦀', rRatio: 0.5, angleOffset: 0.5, found: false },
        { emoji: '🐠', rRatio: 0.9, angleOffset: 1.0, found: false },
        { emoji: '⚓', rRatio: 0.6, angleOffset: 1.5, found: false },
        { emoji: '👑', rRatio: 0.85, angleOffset: 1.9, found: false },
    ];

    // 简单的星星特效
    let sparkles = [];
    function createSparkle(x, y) {
        sparkles.push({ x, y, life: 1.0 });
    }

    // --- 初始化 ---
    function init() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        cx = canvas.width / 2;
        cy = canvas.height * 0.75; 
        
        sideLength = Math.min(canvas.width, canvas.height) * 0.35;
        if (sideLength > 320) sideLength = 320;
        
        draw();
    }

    window.addEventListener('resize', init);
    init();

    // --- 事件监听 ---
    canvas.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', onDrag);
    window.addEventListener('mouseup', stopDrag);

    canvas.addEventListener('touchstart', (e) => startDrag(e.touches[0]), { passive: false });
    window.addEventListener('touchmove', (e) => { if(isDragging) e.preventDefault(); onDrag(e.touches[0]); }, { passive: false });
    window.addEventListener('touchend', stopDrag);

    function startDrag(e) {
        hint.style.opacity = 0;
        const dx = e.clientX - cx;
        const dy = e.clientY - cy;
        const dist = Math.sqrt(dx*dx + dy*dy);

        if (dist < sideLength + 60 && e.clientY < cy + 60) {
            isDragging = true;
            startDragAngle = Math.atan2(dy, dx);
            startRotation = rotationAngle;
        }
    }

    function onDrag(e) {
        if (!isDragging) return;

        const dx = e.clientX - cx;
        const dy = e.clientY - cy;
        const currentAngle = Math.atan2(dy, dx);

        let angleDiff = currentAngle - startDragAngle;
        
        if (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;
        if (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;

        let newRot = startRotation + angleDiff;

        if (newRot < 0) newRot = 0;
        if (newRot > MAX_ROTATION) newRot = MAX_ROTATION;

        rotationAngle = newRot;
        
        if (rotationAngle > maxReachedAngle) {
            maxReachedAngle = rotationAngle;
            updateProgress();
        }

        draw();
    }

    function stopDrag() {
        isDragging = false;
    }

    function updateProgress() {
        const percent = Math.floor((maxReachedAngle / MAX_ROTATION) * 100);
        progressBar.style.width = percent + '%';
        areaPercent.innerText = percent;
        
        // 检查宝藏是否被发现
        let foundCount = 0;
        treasures.forEach(t => {
            if (maxReachedAngle >= t.angleOffset && !t.found) {
                t.found = true;
                createSparkle(cx + sideLength * t.rRatio * Math.cos(Math.PI + t.angleOffset), 
                              cy + sideLength * t.rRatio * Math.sin(Math.PI + t.angleOffset));
                // 为了让火花特效持续更新
                requestAnimationFrame(draw);
            }
            if (t.found) foundCount++;
        });
        treasureCountEl.innerText = foundCount;
    }

    // --- 绘图核心 ---
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. 海平面 (地平线)
        ctx.beginPath();
        ctx.moveTo(0, cy);
        ctx.lineTo(canvas.width, cy);
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 3;
        ctx.stroke();

        // 2. 绘制【扫过的区域】 - 柔和的黄光
        if (maxReachedAngle > 0.001) {
            ctx.save();
            ctx.beginPath();

            const angleA_start = Math.PI; 
            const angleB_start = 4 * Math.PI / 3; 
            
            const angleA_end = Math.PI + maxReachedAngle;
            const angleB_end = 4 * Math.PI / 3 + maxReachedAngle;

            const getX = (angle) => cx + sideLength * Math.cos(angle);
            const getY = (angle) => cy + sideLength * Math.sin(angle);

            ctx.moveTo(cx, cy);
            ctx.lineTo(getX(angleA_start), getY(angleA_start));
            ctx.lineTo(getX(angleB_start), getY(angleB_start));
            ctx.closePath();

            ctx.moveTo(cx, cy);
            ctx.lineTo(getX(angleA_end), getY(angleA_end));
            ctx.lineTo(getX(angleB_end), getY(angleB_end));
            ctx.closePath();

            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, sideLength, angleA_start, angleA_end);
            ctx.closePath();

            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, sideLength, angleB_start, angleB_end);
            ctx.closePath();

            // 光晕渐变
            const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, sideLength);
            gradient.addColorStop(0, 'rgba(253, 224, 71, 0.4)');
            gradient.addColorStop(1, 'rgba(253, 224, 71, 0.1)');
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.restore();
        }

        // 3. 绘制隐藏/发现的宝藏
        treasures.forEach(t => {
            const tx = cx + sideLength * t.rRatio * Math.cos(Math.PI + t.angleOffset);
            const ty = cy + sideLength * t.rRatio * Math.sin(Math.PI + t.angleOffset);
            
            ctx.font = "28px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            
            if (t.found) {
                // 完全显示并带发光
                ctx.shadowColor = '#fde047';
                ctx.shadowBlur = 15;
                ctx.fillText(t.emoji, tx, ty);
                ctx.shadowBlur = 0;
            } else {
                // 没扫到时几乎不可见，增加神秘感
                ctx.globalAlpha = 0.05;
                ctx.fillText(t.emoji, tx, ty);
                ctx.globalAlpha = 1.0;
            }
        });

        // 4. 绘制静态虚线边界 (起始和终点) - 航海图风格
        drawTriangle(0, true, 'rgba(148, 163, 184, 0.4)', null); 
        drawTriangle(MAX_ROTATION, true, 'rgba(148, 163, 184, 0.4)', null); 

        // 5. 绘制当前拖动的三角形光束 - 强光
        drawTriangle(rotationAngle, false, '#fef08a', 'rgba(253, 224, 71, 0.5)'); 

        // 6. 灯塔底座和文字标记
        drawLabels();
        
        // 7. 渲染火花特效
        renderSparkles();
    }

    function drawTriangle(rot, isDashed, strokeColor, fillColor) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(rot);

        ctx.beginPath();
        ctx.moveTo(0, 0); // C
        ctx.lineTo(-sideLength, 0); // A
        
        const bx = sideLength * Math.cos(4 * Math.PI / 3);
        const by = sideLength * Math.sin(4 * Math.PI / 3);
        ctx.lineTo(bx, by);
        
        ctx.closePath();

        if (fillColor) {
            ctx.fillStyle = fillColor;
            ctx.fill();
        }

        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = isDashed ? 1.5 : 3;
        if (isDashed) {
            ctx.setLineDash([8, 8]);
        } else {
            ctx.setLineDash([]);
            // 发光边缘
            ctx.shadowColor = '#fde047';
            ctx.shadowBlur = 10;
        }
        ctx.stroke();
        ctx.restore();
    }

    function drawLabels() {
        // 画灯塔 C 点
        ctx.font = "32px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.shadowColor = 'transparent';
        ctx.fillText("🗼", cx, cy + 20); // 往下稍微偏一点作为底座
        
        ctx.fillStyle = "#cbd5e1";
        ctx.font = "italic 20px 'Times New Roman', serif";
        
        const offset = 35; // 基础偏移距离

        ctx.fillText("C", cx + 30, cy + 20);

        // 终点标记 B' 和 A' (静态)
        const endAngleA = Math.PI + MAX_ROTATION;
        const endAngleB = 4 * Math.PI / 3 + MAX_ROTATION;
        
        const Ax_prime = cx + sideLength * Math.cos(endAngleA);
        const Ay_prime = cy + sideLength * Math.sin(endAngleA);
        const Bx_prime = cx + sideLength * Math.cos(endAngleB);
        const By_prime = cy + sideLength * Math.sin(endAngleB);
        
        const Gx_prime = (cx + Ax_prime + Bx_prime) / 3;
        const Gy_prime = (cy + Ay_prime + By_prime) / 3;

        ctx.fillStyle = "rgba(148, 163, 184, 0.6)"; // 淡一点的标记
        const distGA_prime = Math.hypot(Ax_prime - Gx_prime, Ay_prime - Gy_prime);
        const labelAx_prime = Ax_prime + (Ax_prime - Gx_prime) / distGA_prime * offset;
        const labelAy_prime = Ay_prime + (Ay_prime - Gy_prime) / distGA_prime * offset;
        ctx.fillText("A'", labelAx_prime, labelAy_prime);
        ctx.fillText("B'", cx + sideLength + 20, cy + 20); 
        
        // 动态绘制 A 和 B
        ctx.fillStyle = "#fde047"; // 亮黄色标记光束边缘
        ctx.shadowColor = '#fde047';
        ctx.shadowBlur = 5;
        
        const currentAngleA = Math.PI + rotationAngle;
        const Ax = cx + sideLength * Math.cos(currentAngleA);
        const Ay = cy + sideLength * Math.sin(currentAngleA);

        const currentAngleB = 4 * Math.PI / 3 + rotationAngle;
        const Bx = cx + sideLength * Math.cos(currentAngleB);
        const By = cy + sideLength * Math.sin(currentAngleB);

        const Gx = (Ax + Bx + cx) / 3;
        const Gy = (Ay + By + cy) / 3;

        const dxA = Ax - Gx;
        const dyA = Ay - Gy;
        const lenA = Math.sqrt(dxA*dxA + dyA*dyA);
        const labelAx = Ax + (dxA / lenA) * offset;
        const labelAy = Ay + (dyA / lenA) * offset + 15; 
        
        ctx.fillText("A", labelAx, labelAy);

        const dxB = Bx - Gx;
        const dyB = By - Gy;
        const lenB = Math.sqrt(dxB*dxB + dyB*dyB);
        const labelBx = Bx + (dxB / lenB) * offset;
        const labelBy = By + (dyB / lenB) * offset;
        ctx.fillText("B", labelBx, labelBy);
        
        ctx.shadowBlur = 0;
    }
    
    function renderSparkles() {
        let hasActiveSparkles = false;
        for (let i = sparkles.length - 1; i >= 0; i--) {
            let s = sparkles[i];
            s.life -= 0.02;
            s.y -= 1; // 往上飘
            
            if (s.life <= 0) {
                sparkles.splice(i, 1);
                continue;
            }
            
            hasActiveSparkles = true;
            ctx.save();
            ctx.globalAlpha = s.life;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(s.x, s.y, 3 * s.life, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
        if (hasActiveSparkles) {
            requestAnimationFrame(draw);
        }
    }
</script>




<script>
(function () {
  var storageKey = 'edu_hide_brand_panels';
  var toggleButton = document.getElementById('edu-border-toggle');
  if (!toggleButton || !document.body) {
    return;
  }

  function applyState(hidden) {
    document.body.classList.toggle('edu-hide-brand-panels', hidden);
    toggleButton.textContent = hidden ? '+' : '-';
    toggleButton.setAttribute('aria-pressed', hidden ? 'true' : 'false');
    toggleButton.setAttribute('aria-label', hidden ? '显示说明框' : '隐藏说明框');
    toggleButton.setAttribute('title', hidden ? '显示说明框' : '隐藏说明框');
  }

  var hiddenByDefault = false;
  try {
    hiddenByDefault = localStorage.getItem(storageKey) === '1';
  } catch (e) {
    hiddenByDefault = false;
  }

  applyState(hiddenByDefault);

  toggleButton.addEventListener('click', function () {
    var nextHidden = !document.body.classList.contains('edu-hide-brand-panels');
    applyState(nextHidden);
    try {
      localStorage.setItem(storageKey, nextHidden ? '1' : '0');
    } catch (e) {
      // no-op
    }
  });
})();
</script>
